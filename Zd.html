<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلقيم الخريطة</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 2px dashed #0f0; padding: 40px; text-align: center; border-radius: 10px; }
        input[type="file"] { font-size: 1.2rem; background: #111; color: #0f0; padding: 10px; border: 1px solid #0f0; width: 100%; cursor: pointer; }
        h2 { text-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body>

    <div class="box">
        <h2>بوابة الانتقال الآني</h2>
        <p>اختر ملف الخريطة (map_a.json) لتفعيل القفزة:</p>
        
        <input type="file" id="fileSelector" accept=".json">
    </div>

    <script>
        document.getElementById('fileSelector').onchange = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = JSON.parse(e.target.result);
                    // فك التشفير والانتقال
                    const url = atob(content.data);
                    
                    document.body.innerHTML = "<h1 style='color:#0f0; text-align:center; margin-top:200px;'>جاري القفز عبر الفجوة...</h1>";
                    
                    setTimeout(() => {
                        window.location.href = url;
                    }, 1000);
                } catch (err) {
                    alert("خطأ: الملف الذي اخترته ليس خريطة صحيحة!");
                }
            };
            reader.readAsText(file);
        };
    </script>

</body>
</html>
