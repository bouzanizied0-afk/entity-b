<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Twin Engine v7.0 - Pure Deterministic Sync</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .engine-box { border: 1px solid #00ff41; padding: 25px; border-radius: 12px; width: 520px; background: #000; box-shadow: 0 0 30px rgba(0,255,65,0.1); text-align: center; }
        .status-bar { font-size: 11px; border-bottom: 1px solid #1a1a1a; margin-bottom: 20px; padding-bottom: 10px; color: #008f11; display: flex; justify-content: space-between; }
        #resultImg { width: 100%; margin-top: 20px; border: 1px solid #00ff41; border-radius: 8px; display: none; }
        .progress-bar { width: 100%; background: #111; height: 6px; border-radius: 3px; margin: 15px 0; display: none; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #00ff41; transition: width 0.2s; }
        .terminal-log { font-size: 12px; color: #00ff41; background: #0a0a0a; padding: 15px; border-radius: 5px; text-align: left; direction: ltr; margin-top: 15px; border: 1px solid #111; min-height: 60px; }
        .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        input[type="file"] { color: #00ff41; font-size: 12px; }
        .btn-reset { background: #ff4b2b; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: bold; }
    </style>
</head>
<body>

    <div class="engine-box">
        <div class="status-bar">
            <span>GENESIS_SYNC: ACTIVE</span>
            <span>T: <span id="t-val">0</span></span>
            <span>SYNC: <span id="sync-status">IDLE</span></span>
        </div>
        
        <div class="controls">
            <input type="file" id="filePicker" accept="image/*">
            <div class="progress-bar" id="pBar"><div class="progress-fill" id="pFill"></div></div>
            <button id="globalDelete" class="btn-reset">RESET_NUMERICAL_STREAM</button>
        </div>

        <div class="terminal-log" id="log">SYSTEM_READY...<br>AWAITING_TWIN_STATE...</div>
        
        <img id="resultImg">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات الخادم (التوأم يمتلك نفس الإعدادات)
        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
          storageBucket: "zied-e3b78.firebasestorage.app",
          messagingSenderId: "774724725374",
          appId: "1:774724725374:web:a338e16e8689d60dd3062f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const PATHS = { counter: "temporal/counter", stream: "temporal/stream" };

        let localT = 0;

        // --- محرك التفكيك والتركيب الحتمي ---
        class DeterministicEngine {
            // التفكيك المحلي (المنهج الذي أرسلته)
            static async decompose(file, T, onProgress) {
                const buffer = await file.arrayBuffer();
                const uint8 = new Uint8Array(buffer);
                const Qlen = uint8.length;
                
                // معالجة تسلسلية تضمن عدم تجمد المتصفح (Non-blocking Loop)
                for (let i = 0; i < Qlen; i += 10000) {
                    onProgress(Math.round((i / Qlen) * 100));
                    await new Promise(r => setTimeout(r, 0));
                }

                const s = (T * 31 + Qlen * 7) % Qlen;
                const e = (T * 17 + Qlen * 13) % Qlen;
                const m = Math.floor((s + e) / 2);

                // تحويل البيانات لتمثيل رقمي (Base64 للأداء العالي)
                const v = btoa(String.fromCharCode.apply(null, uint8));

                return { L: Qlen, T: T, S: s, M: m, A: e, V: v, C: file.type };
            }

            // التركيب الفوري عند الطرف الآخر (التوأم)
            static reconstruct(data) {
                const img = document.getElementById("resultImg");
                img.src = `data:${data.C};base64,${data.V}`;
                img.style.display = "block";
                document.getElementById("log").innerHTML = `STATE_LOCKED: T=${data.T} | L=${data.L}<br>MARKERS: S:${data.S} M:${data.M} A:${data.A}`;
            }
        }

        // --- نظام الاستماع والبث اللحظي ---
        onValue(ref(db, PATHS.counter), async (snap) => {
            const sT = snap.val();
            if (sT && sT > localT) {
                const sSnap = await get(ref(db, `${PATHS.stream}/state_${sT}`));
                const data = sSnap.val();
                if (data) {
                    DeterministicEngine.reconstruct(data);
                    localT = sT;
                    document.getElementById("t-val").innerText = sT;
                    document.getElementById("sync-status").innerText = "SYNCED";
                }
            } else if (sT === 0) {
                resetUI();
            }
        });

        // --- عملية الإرسال (توليد الحالة) ---
        document.getElementById('filePicker').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const pBar = document.getElementById('pBar');
            const pFill = document.getElementById('pFill');
            pBar.style.display = 'block';
            document.getElementById("sync-status").innerText = "PROCESSING";

            const counterSnap = await get(ref(db, PATHS.counter));
            const nextT = (counterSnap.val() || 0) + 1;

            const state = await DeterministicEngine.decompose(file, nextT, (p) => {
                pFill.style.width = p + '%';
            });

            await set(ref(db, `${PATHS.stream}/state_${nextT}`), state);
            await set(ref(db, PATHS.counter), nextT);
            
            pBar.style.display = 'none';
            localT = nextT;
        };

        // زر الحذف (تصفير البث لجميع التوائم)
        document.getElementById('globalDelete').onclick = async () => {
            await set(ref(db, PATHS.counter), 0);
            await remove(ref(db, PATHS.stream));
            resetUI();
        };

        function resetUI() {
            document.getElementById("resultImg").style.display = "none";
            document.getElementById("resultImg").src = "";
            document.getElementById("t-val").innerText = "0";
            document.getElementById("sync-status").innerText = "IDLE";
            document.getElementById("log").innerText = "STREAM_VACUUMED.";
            localT = 0;
        }
    </script>
</body>
</html>
