<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بوابة المصفوفة - النسخة المستقرة V4</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; color: #00ff41; }
        
        canvas { border: 1px solid #003300; box-shadow: 0 0 20px #00ff41; background: #000; image-rendering: pixelated; }
        
        .main-ui { position: absolute; background: rgba(0, 15, 0, 0.9); padding: 25px; border: 2px solid #00ff41; display: flex; flex-direction: column; gap: 15px; align-items: center; z-index: 100; box-shadow: 0 0 30px rgba(0, 255, 65, 0.2); }
        
        .status-led { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: bold; }
        .led { width: 12px; height: 12px; border-radius: 50%; background: #500; transition: 0.3s; }
        .led.online { background: #00ff41; box-shadow: 0 0 10px #00ff41; }

        button { background: #00ff41; color: #000; border: none; padding: 12px 30px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; letter-spacing: 1px; }
        button:hover { background: #fff; transform: scale(1.05); }
        button:disabled { background: #003300; color: #00ff41; cursor: not-allowed; }
        
        label { background: #004400; color: #00ff41; padding: 10px 20px; border: 1px dashed #00ff41; cursor: pointer; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="main-ui">
    <div class="status-led">
        <div id="led" class="led"></div>
        <span id="connStatus">اتصال مقطوع</span>
    </div>

    <label for="imageInput">📂 اختر المصدر الرقمي</label>
    <input type="file" id="imageInput" accept="image/*">
    
    <button id="igniteBtn">⚡ إطلاق النقل الآني</button>
    <div id="stats" style="font-size: 10px; opacity: 0.7;">الجهاز جاهز...</div>
</div>

<canvas id="matrixCanvas"></canvas>

<script>
    const SERVER_URL = "https://c7c9c05e-7071-4908-9616-f6be44817257-00-2eyc5vot02n45.worf.replit.dev";
    const socket = io(SERVER_URL, { transports: ["websocket"] });

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    let ROWS = 200, COLS = 200;
    const CELL_SIZE = 3;
    canvas.width = COLS * CELL_SIZE;
    canvas.height = ROWS * CELL_SIZE;

    let liveMatrix = Array.from({length: ROWS}, () => new Uint8Array(COLS));

    // --- تحديث حالة الاتصال ---
    socket.on("connect", () => {
        document.getElementById('led').classList.add('online');
        document.getElementById('connStatus').innerText = "متصل بالبوابة";
    });

    socket.on("disconnect", () => {
        document.getElementById('led').classList.remove('online');
        document.getElementById('connStatus').innerText = "اتصال مقطوع";
    });

    // --- استقبال مصلح 100% ---
    socket.on("matrix-relay", (data) => {
        // التحقق من وصول البيانات الذرية
        if (data.isAtomic && data.payload) {
            const r = data.r;
            // تحويل الـ Payload المستلم (سواء كان مصفوفة أو Buffer) إلى Uint8Array
            const rowData = new Uint8Array(data.payload);
            if (r < ROWS) {
                liveMatrix[r] = rowData;
            }
        }
    });

    function render() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const val = liveMatrix[r][c];
                if (val > 0) {
                    ctx.fillStyle = `rgb(0, ${val * 16}, 65)`;
                    ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 0.5, CELL_SIZE - 0.5);
                }
            }
        }
        requestAnimationFrame(render);
    }
    render();

    // --- زر واحد: فكك وأطلق فوراً ---
    document.getElementById('igniteBtn').onclick = () => {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return alert("اختر صورة!");

        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
            const start = performance.now();
            const processor = document.createElement('canvas').getContext('2d');
            processor.canvas.width = COLS;
            processor.canvas.height = ROWS;
            processor.drawImage(img, 0, 0, COLS, ROWS);

            for (let r = 0; r < ROWS; r++) {
                const imgData = processor.getImageData(0, r, COLS, 1).data;
                const rowBuffer = new Uint8Array(COLS);

                for (let c = 0; c < COLS; c++) {
                    const idx = c * 4;
                    rowBuffer[c] = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3 / 16;
                }

                // الإرسال المصلح: إضافة المفتاح المفقود والتأكد من الصيغة
                socket.emit("matrix-relay", {
                    r: r,
                    payload: Array.from(rowBuffer), // إرسال كمصفوفة لضمان التوافق الشامل
                    isAtomic: true
                });
            }
            document.getElementById('stats').innerText = `اكتمل النقل في: ${(performance.now() - start).toFixed(2)}ms`;
        };
    };
</script>
</body>
</html>
