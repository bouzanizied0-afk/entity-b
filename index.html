<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Universal Moment Translator</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family: monospace; background:#000; color:#0f0 }
canvas { display:block; margin:auto; background:#111 }
</style>
</head>
<body>

<canvas id="canvas" width="256" height="256"></canvas>
<script type="module">

import { UniversalMomentTranslator } from './universal-moment-translator.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ===============================
   Firebase Initialization
=============================== */
const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain: "setouchi-it.firebaseapp.com",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "setouchi-it",
  storageBucket: "setouchi-it.appspot.com",
  messagingSenderId: "456612217542",
  appId: "1:456612217542:web:51d963523b1306e0bf4dc7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const momentRef = ref(db, 'temporal/tick');

/* ===============================
   Canvas & Translator
=============================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const translator = new UniversalMomentTranslator(ctx);

/* ===============================
   Subscribe to moment
=============================== */
onValue(momentRef, (snapshot)=>{
    const moment = snapshot.val();
    if(moment===null) return;
    translator.onMoment(moment);
});

</script>
</body>
</html>
