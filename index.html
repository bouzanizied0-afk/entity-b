<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>شات تقليدية + عداد مستقل</title>
<style>
body { background:#000; color:#0f0; font-family: monospace; margin:0; display:flex; flex-direction:column; align-items:center; padding-top:20px; }
#counter { font-size:32px; margin-bottom:10px; }
#chatContainer { width:60%; max-width:700px; min-width:300px; border:1px solid #0f0; padding:10px; background:#000; display:flex; flex-direction:column; height:400px; overflow-y:auto; }
#chat div { margin-bottom:8px; }
#inputArea { display:flex; width:60%; max-width:700px; min-width:300px; gap:5px; margin-top:5px; }
input[type=text] { flex:1; padding:8px; font-size:16px; }
button { font-size:16px; padding:6px 12px; background:#003300; color:#0f0; border:1px solid #0f0; cursor:pointer; }
img, video { max-width:200px; max-height:150px; margin-top:5px; border:1px solid #0f0; display:block; }
</style>
</head>
<body>

<div id="counter">0</div>
<div id="chatContainer"></div>

<div id="inputArea">
  <input id="input" placeholder="اكتب نص...">
  <button id="sendBtn">إرسال نص</button>
  <button id="fileBtn">إرسال ملف</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// ===== Firebase Config =====
const firebaseConfig = {
  apiKey:"AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain:"setouchi-it.firebaseapp.com",
  databaseURL:"https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId:"setouchi-it",
  storageBucket:"setouchi-it.appspot.com",
  messagingSenderId:"456612217542",
  appId:"1:456612217542:web:51d963523b1306e0bf4dc7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

// ===== DOM =====
const counterDiv = document.getElementById("counter");
const chatDiv = document.getElementById("chatContainer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const fileBtn = document.getElementById("fileBtn");

// ===== Refs =====
const streamRef = ref(db, "chatStream");
const counterRef = ref(db, "temporal/counter");

// ===== Counter =====
let localInterval = null;
function startCounter(){
  if(localInterval) return;
  localInterval = setInterval(async()=>{
    const v = parseInt(counterDiv.textContent||"0",10)+1;
    await set(counterRef, v);
  }, 600);
}
onValue(counterRef, snap=>{
  if(snap.val()!==null) counterDiv.textContent = snap.val();
});
startCounter();

// ===== Receive Messages =====
onChildAdded(streamRef, snap=>{
  const msg = snap.val();
  const div = document.createElement("div");

  if(msg.type === "text"){
    div.textContent = msg.text;
  } else if(msg.type === "file"){
    const ext = msg.fileType.split("/")[0];
    if(ext==="image"){
      const img = document.createElement("img");
      img.src = msg.url;
      div.appendChild(img);
    } else if(ext==="video"){
      const vid = document.createElement("video");
      vid.src = msg.url;
      vid.controls = true;
      div.appendChild(vid);
    } else if(ext==="audio"){
      const aud = document.createElement("audio");
      aud.src = msg.url;
      aud.controls = true;
      div.appendChild(aud);
    } else {
      const a = document.createElement("a");
      a.href = msg.url;
      a.download = msg.fileName||"file.bin";
      a.textContent = "⬇ تحميل الملف";
      div.appendChild(a);
    }
  }

  chatDiv.appendChild(div);
  chatDiv.scrollTop = chatDiv.scrollHeight;
});

// ===== Send Text =====
sendBtn.onclick = async ()=>{
  const text = input.value.trim();
  if(!text) return;
  await push(streamRef, { type:"text", text });
  input.value="";
};

// ===== Send File =====
fileBtn.onclick = ()=>{
  const fileInput = document.createElement("input");
  fileInput.type="file";
  fileInput.onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;

    const storageRef = sRef(storage, "chatFiles/" + Date.now() + "_" + file.name);
    const snapshot = await uploadBytes(storageRef, file);
    const url = await getDownloadURL(snapshot.ref);

    await push(streamRef, {
      type: "file",
      fileName: file.name,
      fileType: file.type,
      url: url
    });
  };
  fileInput.click();
};
</script>
</body>
</html>
