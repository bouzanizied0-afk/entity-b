<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>عداد بسيط متصل بالخادم</title>
</head>
<body>
<h2>عداد دوري من 1 إلى 10</h2>
<div>الرقم الحالي: <span id="counter">0</span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain: "setouchi-it.firebaseapp.com",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "setouchi-it",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// مسار العداد البسيط
const counterRef = ref(db, "test_counter");

// كل ثانية تحديث الرقم من 1 إلى 10
setInterval(async () => {
  try {
    const snap = await get(counterRef);
    let current = snap.val() || 0;
    current = (current >= 10) ? 1 : current + 1;
    await set(counterRef, current);
  } catch (err) {
    console.error("خطأ تحديث العداد:", err);
  }
}, 1000);

// تحديث الرقم في الواجهة تلقائيًا عند تغييره على الخادم
onValue(counterRef, (snap) => {
  document.getElementById("counter").innerText = snap.val() || 0;
});
</script>
</body>
</html>
