<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>نظام المصفوفة الحية - معالج الصور</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #00ff41; }
        canvas { border: 1px solid #003300; box-shadow: 0 0 15px #00ff41; background: #000; }
        .controls { position: absolute; top: 10px; background: rgba(0, 20, 0, 0.9); padding: 15px; border: 1px solid #00ff41; display: flex; gap: 10px; align-items: center; z-index: 100; }
        button { background: #00ff41; color: #000; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #004400; color: #00ff41; }
        input[type="file"] { font-size: 12px; }
        .info { position: absolute; bottom: 10px; left: 10px; font-size: 12px; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <button id="deconstructBtn">تفكيك</button>
    <button id="sendBtn" disabled>إرسال إلى الخادم</button>
    <button id="masterBtn">وضع التلقائي</button>
</div>

<div class="info">
    الحالة: <span id="status">جاهز</span> | العداد: <span id="countDisplay">0</span>
</div>

<canvas id="matrixCanvas"></canvas>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
        authDomain: "zied-e3b78.firebaseapp.com",
        databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "zied-e3b78",
        storageBucket: "zied-e3b78.firebasestorage.app",
        messagingSenderId: "774724725374",
        appId: "1:774724725374:web:a338e16e8689d60dd3062f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const matrixRef = ref(db, "live_matrix/data");
    const counterRef = ref(db, "live_matrix/counter");

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const ROWS = 100; const COLS = 100; const CELL_SIZE = 7;
    canvas.width = COLS * CELL_SIZE; canvas.height = ROWS * CELL_SIZE;

    let localMatrixRows = [];
    let processedMatrix = []; // لحفظ مصفوفة الصورة المفككة
    let globalCounter = 0;
    let isMaster = false;

    // استقبال البيانات
    onValue(matrixRef, (snapshot) => {
        const data = snapshot.val();
        if (data) localMatrixRows = Object.values(data);
    });
    onValue(counterRef, (snapshot) => {
        globalCounter = snapshot.val() || 0;
        document.getElementById('countDisplay').innerText = globalCounter;
    });

    // 1. زر التفكيك: تحويل الصورة إلى مصفوفة أرقام
    document.getElementById('deconstructBtn').onclick = () => {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return alert("اختر صورة أولاً");

        const img = new Image();
        img.onload = () => {
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 100; tempCanvas.height = 100;
            tCtx.drawImage(img, 0, 0, 100, 100);
            const imgData = tCtx.getImageData(0, 0, 100, 100).data;

            processedMatrix = [];
            for (let y = 0; y < 100; y++) {
                let rowStr = "";
                for (let x = 0; x < 100; x++) {
                    const idx = (y * 100 + x) * 4;
                    const brightness = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
                    rowStr += Math.floor(brightness / 26); // تحويل السطوع لرقم 0-9
                }
                processedMatrix.push(rowStr);
            }
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('status').innerText = "تم التفكيك بنجاح";
        };
        img.src = URL.createObjectURL(file);
    };

    // 2. زر الإرسال: دفع مصفوفة الصورة إلى Firebase
    document.getElementById('sendBtn').onclick = () => {
        if (processedMatrix.length === 100) {
            const updates = {};
            processedMatrix.forEach((row, i) => updates[`r${i}`] = row);
            set(matrixRef, updates);
            document.getElementById('status').innerText = "تم الإرسال لجميع المتصفحات";
        }
    };

    // الوضع التلقائي (Master)
    document.getElementById('masterBtn').onclick = () => {
        isMaster = !isMaster;
        document.getElementById('status').innerText = isMaster ? "وضع التلقائي نشط" : "توقف التلقائي";
    };

    // تحديث دوري (فقط إذا كان Master نشط)
    setInterval(() => {
        if (!isMaster) return;
        let nextCounter = (globalCounter % 10) + 1;
        set(counterRef, nextCounter);
    }, 500);

    function render() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = "6px monospace";

        for (let r = 0; r < ROWS; r++) {
            const rowContent = localMatrixRows[r];
            if (!rowContent) continue;
            for (let c = 0; c < COLS; c++) {
                const char = rowContent[c];
                const val = parseInt(char);
                const x = c * CELL_SIZE; const y = r * CELL_SIZE;

                if (val === globalCounter) {
                    ctx.fillStyle = "#fff";
                    ctx.shadowBlur = 5; ctx.shadowColor = "#00ff41";
                } else {
                    ctx.fillStyle = `rgba(0, 255, 65, ${val / 10 + 0.1})`;
                    ctx.shadowBlur = 0;
                }
                ctx.fillText(char, x, y + 6);
            }
        }
        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>
