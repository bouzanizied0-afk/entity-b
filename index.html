<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام توليد الصور من t</title>
<style>
body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
canvas { border:1px solid #0f0; margin-top:20px; }
button { margin-top:10px; padding:8px; cursor:pointer; }
</style>
</head>
<body>

<h2>رفع الصورة وتوليد t</h2>
<input type="file" id="imgInput" accept="image/*">
<button id="sendBtn">إرسال المفتاح t</button>

<canvas id="canvas" width="100" height="100"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// === إعداد Firebase ===
const firebaseConfig = {
  apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
  authDomain: "zied-e3b78.firebaseapp.com",
  databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "zied-e3b78"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const tRef = ref(db, "system/t_key");

// === المتغيرات ===
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let localBytes = null;
let tKey = 0;

// === رفع الصورة وتفكيكها ===
document.getElementById('imgInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = ()=>{
    // ضغط الصورة لتصبح 100×100
    ctx.drawImage(img,0,0,100,100);
    const imgData = ctx.getImageData(0,0,100,100);
    localBytes = imgData.data; // مصفوفة RGBA
    // توليد tKey كناتج جمع كل البايتات
    tKey = localBytes.reduce((sum,b)=>sum+b,0);
    alert("تم التفكيك محلياً. t="+tKey);
  };
  img.src = URL.createObjectURL(file);
});

// === إرسال t فقط ===
document.getElementById('sendBtn').onclick = ()=>{
  if(!tKey) return alert("لم يتم رفع الصورة بعد!");
  set(tRef,{t:tKey, timestamp:Date.now()});
  alert("تم إرسال t إلى الخادم");
};

// === المستقبل: إعادة توليد الصورة من t ===
onValue(tRef, (snapshot)=>{
  const val = snapshot.val();
  if(!val) return;
  const tReceived = val.t;
  // دالة توليد RGBA وهمية من t (Mathematical Reconstruction)
  const imgData = ctx.createImageData(100,100);
  for(let i=0;i<imgData.data.length;i++){
    imgData.data[i] = (tReceived + i*31) % 256; // مثال توليد ثابت
  }
  ctx.putImageData(imgData,0,0);
});
</script>
</body>
</html>
