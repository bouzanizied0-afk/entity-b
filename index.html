<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⏳ Temporal Numeric Stream - نسخة الدمج الفائق</title>
<style>
body { background:#000; color:#0f0; font-family: monospace; text-align:center; padding-top:20px; }
#counter, #sendCounter { font-size:48px; margin:10px; }
#chat { font-size:22px; color:#ff0; margin:20px auto; width:80%; max-height:500px; overflow-y:auto; text-align:left; border:1px solid #0f0; padding:10px; white-space:pre-wrap; }
input[type=text] { width:50%; font-size:18px; padding:8px; }
button { font-size:16px; padding:8px 16px; margin:5px; background:#003300; color:#0f0; border:1px solid #0f0; }
img, video, audio { max-width:100%; display:block; margin-top:10px; border:1px solid #0f0; cursor:pointer; }
a { color:#0ff; display:block; margin-top:10px; }
</style>
</head>
<body>
<h2>⏳ بث رقمي مزدوج - نسخة الدمج الفائق (WebRTC + Firebase)</h2>
<div>العداد للتزامن: <span id="counter">0</span></div>
<div>العداد للإرسال الفوري: <span id="sendCounter">0</span></div>
<div id="chat"></div>
<input id="input" placeholder="اكتب أي شيء">
<button id="sendBtn">إرسال نص</button>
<button id="fileBtn">إرسال ملف</button>
<button id="clearBtn">🗑 حذف الكل</button>
<button id="leaderBtn">▶ تشغيل العداد</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ===== Firebase Setup =====
const firebaseConfig = {
  apiKey:"AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain:"setouchi-it.firebaseapp.com",
  databaseURL:"https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId:"setouchi-it",
  storageBucket:"setouchi-it.appspot.com",
  messagingSenderId:"456612217542",
  appId:"1:456612217542:web:51d963523b1306e0bf4dc7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== DOM =====
const counterRef = ref(db,"temporal/counter");
const sendTickRef = ref(db,"temporal/sendTick");
const leaderRef = ref(db,"temporal/leader");
const streamRef = ref(db,"temporal/stream");

const counterDiv = document.getElementById("counter");
const sendCounterDiv = document.getElementById("sendCounter");
const chatDiv = document.getElementById("chat");
const input = document.getElementById("input");
const leaderBtn = document.getElementById("leaderBtn");

// ===== Client ID =====
let localInterval = null;
let isLeader = false;
if(!sessionStorage.getItem("clientId")){
  sessionStorage.setItem("clientId","c_"+Date.now()+"_"+Math.random());
}
const clientId = sessionStorage.getItem("clientId");

// ===== Leader Control =====
function startCounter(){
  if(localInterval) return;
  localInterval = setInterval(async()=>{
    if(!isLeader) return;
    let v = parseInt(counterDiv.textContent||"0",10) + 1;
    await set(counterRef,v);
  },600);
}

onValue(leaderRef, snap=>{
  isLeader = snap.val() === clientId;
  leaderBtn.textContent = isLeader ? "⏸ إيقاف العداد" : "▶ تشغيل العداد";

  // شغل العداد إذا أصبح قائد
  if(isLeader && !localInterval) startCounter();
  // أوقف العداد إذا لم يعد قائد
  if(!isLeader && localInterval){ clearInterval(localInterval); localInterval=null; }
});

leaderBtn.onclick = async()=>{
  if(isLeader){
    clearInterval(localInterval); localInterval=null; 
    await set(leaderRef,null);
  } else { 
    await set(leaderRef,clientId);
  }
};

// ===== Counter display =====
onValue(counterRef,snap=>{
  if(snap.val()!==null) counterDiv.textContent=snap.val();
});

// ===== WebRTC Setup =====
let peerConnection = null;
let dataChannel = null;
const config = { iceServers:[{urls:"stun:stun.l.google.com:19302"}]};

async function setupConnection(){
  peerConnection = new RTCPeerConnection(config);
  dataChannel = peerConnection.createDataChannel("fastChannel");
  dataChannel.binaryType = "arraybuffer";
  dataChannel.onmessage = e => detectAndDisplayFile(e.data);

  peerConnection.onicecandidate = e => {
    if(e.candidate) push(ref(db,`temporal/webrtc/${clientId}/ice`),JSON.stringify(e.candidate));
  };

  onValue(ref(db,"temporal/webrtc/offer"), async snap=>{
    if(!snap.exists()) return;
    const offer = JSON.parse(snap.val());
    await peerConnection.setRemoteDescription(offer);
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    await set(ref(db,"temporal/webrtc/answer"),JSON.stringify(answer));
  });

  onValue(ref(db,"temporal/webrtc/answer"), async snap=>{
    if(!snap.exists()) return;
    const answer = JSON.parse(snap.val());
    if(!peerConnection.currentRemoteDescription)
      await peerConnection.setRemoteDescription(answer);
  });

  onValue(ref(db,`temporal/webrtc/${clientId}/ice`),snap=>{
    if(snap.exists()){
      Object.values(snap.val()).forEach(c=>peerConnection.addIceCandidate(JSON.parse(c)));
    }
  });
}

// ===== File Detection & Display =====
function detectAndDisplayFile(arrayBuffer){
  const arr = new Uint8Array(arrayBuffer);
  const blob = new Blob([arr]);
  const url = URL.createObjectURL(blob);
  let element;

  // PNG
  if(arr[0]===0x89 && arr[1]===0x50 && arr[2]===0x4E && arr[3]===0x47)
    element=document.createElement("img");
  // JPG
  else if(arr[0]===0xFF && arr[1]===0xD8)
    element=document.createElement("img");
  // GIF
  else if(arr[0]===0x47 && arr[1]===0x49 && arr[2]===0x46)
    element=document.createElement("img");
  // MP4
  else if(arr[4]===0x66 && arr[5]===0x74 && arr[6]===0x79 && arr[7]===0x70){
    element=document.createElement("video"); element.controls=true; element.autoplay=true;
  }
  // MP3
  else if(arr[0]===0x49 && arr[1]===0x44 && arr[2]===0x33){
    element=document.createElement("audio"); element.controls=true;
  }
  // WAV / RIFF
  else if(arr[0]===0x52 && arr[1]===0x49 && arr[2]===0x46 && arr[3]===0x46){
    element=document.createElement("audio"); element.controls=true;
  }
  // أي نوع آخر
  else{
    element=document.createElement("a");
    element.href=url;
    element.download="file.bin";
    element.textContent="⬇ تحميل الملف";
  }

  if(element.tagName!=="A") element.src=url;

  // إضافة ميزة الضغط لعرض/تكبير الصورة
  if(element.tagName==="IMG" || element.tagName==="VIDEO") {
    element.onclick = ()=>window.open(url,"_blank");
  }

  chatDiv.appendChild(element);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

// ===== Send Data =====
async function sendDataWebRTC(arrayBuffer){
  if(dataChannel && dataChannel.readyState==="open")
    dataChannel.send(arrayBuffer);
}

// ===== Send Text =====
document.getElementById("sendBtn").onclick=()=>{
  const arr=Array.from(input.value).map(ch=>ch.charCodeAt(0));
  sendDataWebRTC(new Uint8Array(arr).buffer);
  input.value="";
};

// ===== Send File =====
document.getElementById("fileBtn").onclick=()=>{
  const fileInput=document.createElement("input");
  fileInput.type="file";
  fileInput.onchange=async e=>{
    const file = e.target.files[0];
    if(!file) return;
    const chunkSize=64*1024; // 64KB
    for(let i=0;i<file.size;i+=chunkSize){
      const slice = file.slice(i,i+chunkSize);
      const buffer = await slice.arrayBuffer();
      await sendDataWebRTC(buffer);
    }
  };
  fileInput.click();
};

// ===== Fast Reader Firebase Backup =====
onValue(sendTickRef,snap=>{
  const data=snap.val()||{};
  sendCounterDiv.textContent=Object.keys(data).length;
});

// ===== Clear =====
document.getElementById("clearBtn").onclick=async()=>{
  await set(streamRef,null);
  await set(counterRef,0);
  await set(sendTickRef,null);
  counterDiv.textContent="0";
  sendCounterDiv.textContent="0";
  chatDiv.innerHTML="";
};

// ===== Initialize =====
setupConnection();
</script>
</body>
</html>
