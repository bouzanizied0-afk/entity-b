<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⏳ شات بسيط مع عداد مستقل</title>
<style>
body {
  margin:0;
  padding:0;
  background:#000;
  color:#0f0;
  font-family: monospace;
  display:flex;
  flex-direction:column;
  height:100vh;
}
#counter {
  font-size:48px;
  text-align:center;
  padding:10px;
  border-bottom:1px solid #0f0;
}
#chat {
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:18px;
  border-bottom:1px solid #0f0;
  white-space:pre-wrap;
}
#inputArea {
  display:flex;
  padding:10px;
  gap:5px;
}
input[type=text] {
  flex:1;
  font-size:16px;
  padding:8px;
}
button {
  font-size:16px;
  padding:8px 12px;
  background:#003300;
  color:#0f0;
  border:1px solid #0f0;
  cursor:pointer;
}
img, video, audio {
  max-width:100%;
  margin-top:10px;
  border:1px solid #0f0;
}
</style>
</head>
<body>

<div id="counter">0</div>
<div id="chat"></div>

<div id="inputArea">
  <input id="input" placeholder="اكتب نص...">
  <button id="sendBtn">إرسال نص</button>
  <button id="fileBtn">إرسال ملف</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ===== Firebase Setup =====
const firebaseConfig = {
  apiKey:"AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain:"setouchi-it.firebaseapp.com",
  databaseURL:"https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId:"setouchi-it",
  storageBucket:"setouchi-it.appspot.com",
  messagingSenderId:"456612217542",
  appId:"1:456612217542:web:51d963523b1306e0bf4dc7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== DOM =====
const counterDiv = document.getElementById("counter");
const chatDiv = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const fileBtn = document.getElementById("fileBtn");

// ===== Client ID =====
if(!sessionStorage.getItem("clientId")){
  sessionStorage.setItem("clientId","c_"+Date.now()+"_"+Math.random());
}
const clientId = sessionStorage.getItem("clientId");

// ===== Counter مستقل =====
let counter = 0;
setInterval(()=>{
  counter++;
  counterDiv.textContent = counter;
}, 600);

// ===== Stream Reference =====
const streamRef = ref(db, "chatStream");

// ===== استقبال الرسائل =====
onChildAdded(streamRef, snap=>{
  const msg = snap.val();
  const div = document.createElement("div");

  if(msg.type === "text"){
    div.textContent = msg.text;
  } else if(msg.type === "file"){
    const blob = new Blob([new Uint8Array(msg.data)], { type: msg.fileType || "application/octet-stream" });
    const url = URL.createObjectURL(blob);

    if(msg.fileType.startsWith("image/")){
      const img = document.createElement("img");
      img.src = url;
      div.appendChild(img);
    } else if(msg.fileType.startsWith("video/")){
      const vid = document.createElement("video");
      vid.src = url;
      vid.controls = true;
      div.appendChild(vid);
    } else if(msg.fileType.startsWith("audio/")){
      const aud = document.createElement("audio");
      aud.src = url;
      aud.controls = true;
      div.appendChild(aud);
    } else {
      const a = document.createElement("a");
      a.href = url;
      a.download = msg.fileName || "file.bin";
      a.textContent = "⬇ تحميل الملف";
      div.appendChild(a);
    }
  }

  chatDiv.appendChild(div);
  chatDiv.scrollTop = chatDiv.scrollHeight;
});

// ===== إرسال نص =====
sendBtn.onclick = async ()=>{
  const text = input.value.trim();
  if(!text) return;
  await push(streamRef, { type:"text", text });
  input.value = "";
};

// ===== إرسال ملفات =====
fileBtn.onclick = ()=>{
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = async evt=>{
      const arr = new Uint8Array(evt.target.result);
      await push(streamRef, {
        type:"file",
        fileName:file.name,
        fileType:file.type,
        data:Array.from(arr)
      });
    };
    reader.readAsArrayBuffer(file);
  };
  fileInput.click();
};

</script>
</body>
</html>
