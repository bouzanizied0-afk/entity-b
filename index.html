<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Twin Video Engine v1.0</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .factory-box { border: 2px solid #00ff41; padding: 20px; width: 480px; background: #000; text-align: center; }
        video, canvas { width: 100%; border: 1px solid #111; margin-top: 10px; background: #000; }
        .stream-info { font-size: 11px; color: #008f11; display: flex; justify-content: space-between; margin-top: 5px; }
        .btn-stream { background: #00ff41; color: #000; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="factory-box">
        <h3>VIDEO_GENE_STREAMER</h3>
        
        <input type="file" id="videoSource" accept="video/*" style="font-size: 12px; color: #00ff41;">
        <video id="localPreview" muted controls style="display:none;"></video>
        
        <button id="startSync" class="btn-stream">START_TWIN_BROADCAST</button>

        <canvas id="twinDisplay"></canvas>

        <div class="stream-info">
            <span>BITRATE: <span id="bitrate">0</span> kb/s</span>
            <span>FRAME_T: <span id="frame-t">0</span></span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const video = document.getElementById('localPreview');
        const canvas = document.getElementById('twinDisplay');
        const ctx = canvas.getContext('2d');
        const offscreenCanvas = document.createElement('canvas');
        const offscreenCtx = offscreenCanvas.getContext('2d');

        // --- المستقبل: تركيب الفيديو من بصمات الإطارات ---
        onValue(ref(db, "video_stream/frame"), (snap) => {
            const frameData = snap.val();
            if (frameData) {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    document.getElementById('frame-t').innerText = frameData.t;
                };
                img.src = frameData.dna;
            }
        });

        // --- المرسل: تفكيك الفيديو إلى نبضات جينية ---
        document.getElementById('videoSource').onchange = (e) => {
            const file = e.target.files[0];
            video.src = URL.createObjectURL(file);
            video.style.display = "block";
        };

        document.getElementById('startSync').onclick = () => {
            video.play();
            streamFrames();
        };

        async function streamFrames() {
            if (video.paused || video.ended) return;

            // رسم الإطار الحالي في كانفاس مخفي لتفكيكه
            offscreenCanvas.width = video.videoWidth / 4; // تقليل الحجم لسرعة النسخة المبدئية
            offscreenCanvas.height = video.videoHeight / 4;
            offscreenCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);

            // تحويل الإطار إلى "بصمة جينية" (DNA)
            const frameDNA = offscreenCanvas.toDataURL("image/webp", 0.3);

            // إرسال البصمة فورياً
            set(ref(db, "video_stream/frame"), {
                t: video.currentTime.toFixed(2),
                dna: frameDNA
            });

            // تكرار العملية (24 إطار في الثانية تقريباً)
            requestAnimationFrame(streamFrames);
        }
    </script>
</body>
</html>
