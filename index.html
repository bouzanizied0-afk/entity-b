<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>نظام المصفوفة المركزية الأفقية 100x100</title>
    <style>
        body { margin: 0; background: #000; color: #00ff41; font-family: monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 1px solid #003300; }
        .info { position: absolute; top: 10px; left: 10px; font-size: 12px; background: rgba(0,20,0,0.8); padding: 8px; border: 1px solid #00ff41; pointer-events: none; }
    </style>
</head>
<body>

<div class="info">
    الحالة: <span id="status">جاري المزامنة...</span><br>
    العداد: <span id="syncCounter">0</span><br>
    المصدر: <span id="sourceRole">مستقبل</span>
</div>

<canvas id="matrixCanvas"></canvas>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
        authDomain: "zied-e3b78.firebaseapp.com",
        databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "zied-e3b78",
        storageBucket: "zied-e3b78.firebasestorage.app",
        messagingSenderId: "774724725374",
        appId: "1:774724725374:web:a338e16e8689d60dd3062f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const matrixRef = ref(db, "sync/matrix_state_horizontal");
    const counterRef = ref(db, "sync/central_counter");

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    const ROWS = 100;
    const COLS = 100;
    const CELL_SIZE = 8;

    canvas.width = COLS * CELL_SIZE;
    canvas.height = ROWS * CELL_SIZE;

    let serverMatrix = []; // المصفوفة المستلمة من الخادم
    let centralCounter = 0;
    let isMaster = false;

    // --- 1. استقبال العداد المركزي ---
    onValue(counterRef, (snapshot) => {
        centralCounter = snapshot.val() || 0;
        document.getElementById('syncCounter').innerText = centralCounter;
    });

    // --- 2. استقبال المصفوفة الكاملة (أفقياً) ---
    onValue(matrixRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            // تحويل الكائن المستلم إلى مصفوفة صفوف نصية
            serverMatrix = Object.values(data);
            document.getElementById('status').innerText = "متصل - بيانات حقيقية";
        }
    });

    // --- 3. وظيفة القائد (تحديث الخادم) ---
    window.onclick = () => {
        isMaster = true;
        document.getElementById('sourceRole').innerText = "قائد (تحديث نشط)";
    };

    function updateServer() {
        if (!isMaster) return;

        let newCounter = (centralCounter % 10) + 1;
        let fullData = {};

        for (let r = 0; r < ROWS; r++) {
            let rowStr = "";
            for (let c = 0; c < COLS; c++) {
                // توليد الرقم بناءً على دالة جيبية دورية
                const val = Math.floor(Math.abs(Math.sin(r * 0.1 + c * 0.1 + (newCounter * 0.5)) * 10));
                rowStr += val.toString();
            }
            fullData[`row_${r}`] = rowStr; // تخزين الصف كـ String أفقي
        }

        set(counterRef, newCounter);
        set(matrixRef, fullData);
    }

    // تحديث الخادم بمعدل ثابت (كل 500ms) لضمان الاستقرار
    setInterval(updateServer, 500);

    // --- 4. الرسم (يعتمد كلياً على serverMatrix) ---
    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (serverMatrix.length > 0) {
            ctx.font = "7px monospace";
            
            for (let r = 0; r < ROWS; r++) {
                const rowStr = serverMatrix[r];
                if (!rowStr) continue;

                for (let c = 0; c < COLS; c++) {
                    const num = rowStr[c]; // قراءة الرقم من السلسلة النصية الأفقية
                    const x = c * CELL_SIZE;
                    const y = r * CELL_SIZE;

                    // التوهج بناءً على العداد وقيمة الخلية المستلمة
                    const valInt = parseInt(num);
                    if (valInt === centralCounter) {
                        ctx.fillStyle = "#ffffff";
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = "#00ff41";
                    } else {
                        ctx.fillStyle = `rgba(0, 255, 65, ${valInt / 10 + 0.1})`;
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillText(num, x, y + 7);
                }
            }
        }
        requestAnimationFrame(draw);
    }

    draw();
</script>

</body>
</html>
