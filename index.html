<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⏳ العداد المتزامن الأعمى</title>
<style>
body {
  background:#000;
  color:#0f0;
  font-family: monospace;
  text-align:center;
  padding-top:20px;
}
#counter {
  font-size:64px;
  margin:20px;
}
#chat {
  font-size:22px;
  color:#ff0;
  margin:20px auto;
  width:80%;
  max-height:300px;
  overflow-y:auto;
  text-align:left;
  border:1px solid #0f0;
  padding:10px;
}
input[type=text] {
  width:50%;
  font-size:18px;
  padding:8px;
}
button {
  font-size:16px;
  padding:8px 16px;
  margin:5px;
  background:#003300;
  color:#0f0;
  border:1px solid #0f0;
}
</style>
</head>
<body>

<h2>⏳ العداد المتزامن الأعمى</h2>
<div id="counter">0</div>

<div id="chat"></div>

<input id="messageInput" placeholder="اكتب رسالتك هنا">
<button id="sendBtn">إرسال نص</button>
<button id="fileBtn">إرسال ملف</button>
<button id="clearBtn">🗑 حذف الكل</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* =============================
   1️⃣ إعداد Firebase (الخادم الأعمى)
============================= */
const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain: "setouchi-it.firebaseapp.com",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "setouchi-it",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const counterRef = ref(db, "temporal/counter");

/* =============================
   2️⃣ العداد المتزامن المطلق
============================= */
const counterDiv = document.getElementById("counter");

// قراءة الرقم فقط (لا معنى – لا تفسير)
onValue(counterRef, snap => {
  if (snap.exists()) {
    counterDiv.textContent = snap.val();
    interpretMoment(snap.val()); // التفسير محلي فقط
  }
});

// كتابة الرقم (وظيفة وحيدة للخادم)
setInterval(() => {
  const current = parseInt(counterDiv.textContent || "0", 10);
  set(counterRef, current + 1);
}, 600);

/* =============================
   3️⃣ المترجم الزمني (محلي)
============================= */
const chat = document.getElementById("chat");

/*
  هذا هو جوهر فكرتك:
  نفس الرقم → معاني مختلفة حسب الشيفرة
*/
function interpretMoment(moment) {

  // مثال شيفرة: تحويل الزمن إلى حرف
  const alphabet = "ابتثجحخدذرزسشصضطظعغفقكلمنهوي";
  const letter = alphabet[moment % alphabet.length];

  // مثال حالة / معنى
  let state = "";
  if (moment % 15 === 0) state = "⚠ لحظة انعطاف";
  else if (moment % 7 === 0) state = "✦ توافق زمني";
  else state = "• مرور عادي";

  render(`${letter} — ${state}`);
}

function render(text) {
  const line = document.createElement("div");
  line.textContent = text;
  chat.appendChild(line);
  chat.scrollTop = chat.scrollHeight;
}

/* =============================
   4️⃣ الواجهة الوهمية (لا خادم)
============================= */
document.getElementById("sendBtn").onclick = () =>
  alert("الخادم أعمى: لا نصوص، فقط زمن.");

document.getElementById("fileBtn").onclick = () =>
  alert("الخادم أعمى: لا ملفات، فقط لحظة.");

document.getElementById("clearBtn").onclick = () =>
  alert("لا يوجد شيء يُمسح؛ الزمن لا يُحذف.");

</script>
</body>
</html>
