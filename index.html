<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجارب دردشة + عداد متزامن</title>
    <style>
        body {
            font-family: sans-serif;
            background: #e5ddd5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            background: #fff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .chat-header {
            background: #075e54;
            color: #fff;
            padding: 15px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #ece5dd;
        }
        .message {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 8px;
            position: relative;
            word-wrap: break-word;
        }
        .message.sent { background: #dcf8c6; align-self: flex-end; }
        .message.received { background: #fff; align-self: flex-start; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .message .delete-btn {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 10px;
            cursor: pointer;
            color: red;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
            gap: 5px;
        }
        .chat-input input[type="text"] {
            flex: 1;
            padding: 8px;
            border-radius: 20px;
            border: 1px solid #ccc;
        }
        .chat-input input[type="file"] { display: none; }
        .chat-input label {
            cursor: pointer;
            padding: 8px 12px;
            background: #25d366;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input button {
            padding: 8px 12px;
            background: #128c7e;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        تجارب الدردشة
        <span id="serverTimer">0</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="اكتب رسالة...">
        <label for="fileInput">📎</label>
        <input type="file" id="fileInput" accept="image/*">
        <button id="sendBtn">إرسال</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ---------- إعداد Firebase ----------
    const firebaseConfig = {
        apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
        authDomain: "setouchi-it.firebaseapp.com",
        databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "setouchi-it",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ---------- عداد متزامن heartbeat ----------
    const heartbeatRef = ref(db, "system/heartbeat");

    setInterval(async () => {
        try {
            const snap = await get(heartbeatRef);
            let current = snap.val() || 0;
            current = (current >= 10) ? 1 : current + 1;
            await set(heartbeatRef, current);
        } catch (err) { console.error("خطأ تحديث heartbeat:", err); }
    }, 1000);

    onValue(heartbeatRef, (snap) => {
        const timerEl = document.getElementById("serverTimer");
        if (timerEl) timerEl.innerText = snap.val() || 0;
    });

    // ---------- واجهة الدردشة ----------
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const fileInput = document.getElementById("fileInput");

    // إرسال رسالة نصية
    sendBtn.onclick = () => {
        const text = chatInput.value.trim();
        if (!text) return;
        addMessage(text, "sent");
        chatInput.value = "";
    };

    // إرسال صورة
    fileInput.onchange = () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => addMessage(reader.result, "sent", true);
        reader.readAsDataURL(file);
    };

    // إضافة رسالة
    function addMessage(content, type="received", isImage=false) {
        const msg = document.createElement("div");
        msg.classList.add("message", type);

        const deleteBtn = document.createElement("span");
        deleteBtn.textContent = "×";
        deleteBtn.classList.add("delete-btn");
        deleteBtn.onclick = () => msg.remove();
        msg.appendChild(deleteBtn);

        if (isImage) {
            const img = document.createElement("img");
            img.src = content;
            msg.appendChild(img);
        } else {
            const textNode = document.createElement("div");
            textNode.textContent = content;
            msg.appendChild(textNode);
        }

        chatMessages.appendChild(msg);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
