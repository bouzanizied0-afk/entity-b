<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بوابة المصفوفة العالمية - Ultra Dynamic V2</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #00ff41; }
        canvas { background: #000; image-rendering: pixelated; border: 1px solid #004400; box-shadow: 0 0 20px #00ff41; }
        .controls { position: absolute; top: 10px; background: rgba(0, 10, 0, 0.9); padding: 12px; border: 1px solid #00ff41; display: flex; gap: 12px; z-index: 100; font-size: 13px; align-items: center; }
        button { background: #00ff41; color: #000; border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #fff; }
        button:disabled { background: #003300; color: #00ff41; }
        #resDisplay { color: #fff; font-weight: bold; }
        /* شريط تقدم مدمج */
        #progressContainer { width: 100px; height: 5px; border: 1px solid #00ff41; display: none; }
        #progressBar { width: 0%; height: 100%; background: #00ff41; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <button id="deconstructBtn">تفكيك HD</button>
    <div id="progressContainer"><div id="progressBar"></div></div>
    <button id="sendBtn" disabled>بث عبر البوابة</button>
    <span id="resDisplay">الأبعاد: 0x0</span>
</div>

<div id="status" style="position: absolute; bottom: 10px; right: 10px; font-size: 12px;">جاري الاتصال بالأنبوب...</div>

<canvas id="matrixCanvas"></canvas>

<script type="module">
    import { extractMatrix } from './matrixEngine.js';

    const SERVER_URL = "https://c7c9c05e-7071-4908-9616-f6be44817257-00-2eyc5vot02n45.worf.replit.dev";
    const socket = io(SERVER_URL, { transports: ["websocket"] });

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let liveMatrix = [];
    let localProcessedMatrix = null;
    let ROWS = 0, COLS = 0;
    let CELL_SIZE = 2; 

    socket.on("connect", () => {
        document.getElementById('status').innerText = "✅ متصل بالبوابة السريعة";
    });

    socket.on("matrix-relay", (data) => {
        if (data.matrix) {
            const newRows = data.matrix.length;
            const newCols = data.matrix[0].length;
            if (newRows !== ROWS || newCols !== COLS) {
                ROWS = newRows; COLS = newCols;
                canvas.width = COLS * CELL_SIZE; canvas.height = ROWS * CELL_SIZE;
                document.getElementById('resDisplay').innerText = `الأبعاد: ${COLS}x${ROWS}`;
            }
            // دمج البيانات المستلمة: إذا كانت جزئية لا تمسح القديم بل تملأه
            if (data.isPartial && liveMatrix.length === newRows) {
                data.matrix.forEach((row, i) => {
                    if (row.some(v => v > 0)) liveMatrix[i] = row;
                });
            } else {
                liveMatrix = data.matrix;
            }
        }
    });

    document.getElementById('deconstructBtn').onclick = async () => {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return alert("اختر صورة أولاً");
        
        document.getElementById('progressContainer').style.display = "block";
        document.getElementById('progressBar').style.width = "50%";

        const img = new Image();
        img.onload = () => {
            const QUALITY = 250; 
            localProcessedMatrix = extractMatrix(img, QUALITY, QUALITY, 16);
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('progressBar').style.width = "100%";
            setTimeout(() => { document.getElementById('progressContainer').style.display = "none"; }, 500);
            
            ROWS = localProcessedMatrix.length;
            COLS = localProcessedMatrix[0].length;
            canvas.width = COLS * CELL_SIZE;
            canvas.height = ROWS * CELL_SIZE;
            liveMatrix = [...localProcessedMatrix];
            document.getElementById('status').innerText = "تم التفكيك - جاهز للبث";
        };
        img.src = URL.createObjectURL(file);
    };

    // --- الإرسال التدريجي المبتكر (فكرتك) ---
    document.getElementById('sendBtn').onclick = () => {
        if (localProcessedMatrix) {
            document.getElementById('status').innerText = "جاري البث التدريجي...";
            
            // الموجة 1: إرسال الملامح (الأسطر الزوجية فقط)
            const skeleton = localProcessedMatrix.map((row, i) => i % 2 === 0 ? row : new Array(COLS).fill(0));
            socket.emit("matrix-relay", { matrix: skeleton, isPartial: true });

            // الموجة 2: إرسال التفاصيل (بعد 300 مللي ثانية)
            setTimeout(() => {
                socket.emit("matrix-relay", { matrix: localProcessedMatrix, isPartial: false });
                document.getElementById('status').innerText = "تم البث بالكامل ✅";
            }, 300);
        }
    };

    function render() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (liveMatrix.length > 0) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const val = liveMatrix[r][c];
                    if (val > 0) {
                        // استخدام نظام الألوان السداسية من النسخة البدائية لكن برسم البكسل الاحترافي
                        ctx.fillStyle = `rgb(0, ${val * 15.9}, 65)`;
                        ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }
        }
        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>
