<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام التزامن المتقدم</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #00d4ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #111; padding: 30px; border-radius: 20px; border: 1px solid #333; width: 400px; text-align: center; }
        .server-status { font-family: monospace; font-size: 11px; color: #555; margin-bottom: 20px; }
        input[type="file"] { background: #222; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; color: #00d4ff; cursor: pointer; }
        #resultImg { width: 100%; border-radius: 12px; margin-top: 20px; display: none; border: 2px solid #00d4ff; box-shadow: 0 0 15px rgba(0,212,255,0.3); }
        .status-text { margin-top: 15px; font-size: 13px; color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <div class="server-status">SERVER HEARTBEAT: <span id="timer">0</span></div>
        <h2 style="margin-top:0">بث الحالات</h2>
        
        <input type="file" id="filePicker" accept="image/*">
        
        <div id="msg" class="status-text">في انتظار اتصال...</div>
        <img id="display" alt="المحتوى المتزامن">
    </div>

    <script type="module">
        import { StateEngine } from './engine.js';

        // ربط المحرك بالواجهة
        const engine = new StateEngine({
            onNewState: (imageUrl) => {
                const img = document.getElementById('display');
                img.src = imageUrl;
                img.style.display = 'block';
            },
            onStatusChange: (text) => {
                document.getElementById('msg').innerText = text;
            },
            onHeartbeat: (val) => {
                document.getElementById('timer').innerText = val;
            }
        });

        // حدث اختيار ملف
        document.getElementById('filePicker').onchange = (e) => {
            if (e.target.files[0]) engine.sendFile(e.target.files[0]);
        };
    </script>
</body>
</html>
