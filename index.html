<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مصفوفة ديناميكية للصورة</title>
<style>
body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
canvas { border: 1px solid #333; margin-top: 20px; }
#status { margin-top: 10px; color: #888; }
</style>
</head>
<body>

<h2>رفع الصورة - توليد مصفوفة ديناميكية</h2>
<input type="file" id="imageInput" accept="image/*">
<div id="status">في انتظار الصورة...</div>
<canvas id="matrixCanvas"></canvas>

<script>
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

document.getElementById('imageInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 100*1024){ // أقل من 100 كيلوبايت
        status.innerText = "الملف أكبر من 100KB. اختر صورة أصغر.";
        return;
    }

    const reader = new FileReader();
    reader.onload = function(evt){
        const img = new Image();
        img.onload = function(){
            // ضبط المصفوفة حسب حجم الصورة
            canvas.width = img.width;
            canvas.height = img.height;

            // رسم الصورة على الكانفاس لالتقاط البايتات
            ctx.drawImage(img,0,0,img.width,img.height);
            const imgData = ctx.getImageData(0,0,img.width,img.height);
            const data = imgData.data; // RGBA

            // توليد مصفوفة رقمية ديناميكية
            for(let y=0; y<img.height; y++){
                for(let x=0; x<img.width; x++){
                    const idx = (y*img.width + x) * 4;
                    const value = data[idx]; // نأخذ قناة الأحمر كمثال
                    // نعيد رسم خلية تمثل البايت
                    ctx.fillStyle = `rgb(${value},${value},${value})`;
                    ctx.fillRect(x,y,1,1);
                }
            }

            status.innerText = `تم توليد المصفوفة: ${img.width}x${img.height} بكسل`;
        };
        img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
});
</script>

</body>
</html>
