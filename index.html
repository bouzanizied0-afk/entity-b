<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUP Unified Console | ziedzizou-7b74d</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-green: #00ff41;
            --neon-red: #ff3131;
            --dark-bg: #050505;
            --panel-bg: rgba(10, 10, 15, 0.9);
            --border-glow: 0 0 15px rgba(0, 242, 255, 0.3);
        }
        body { background: var(--dark-bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .dashboard { background: var(--panel-bg); border: 1px solid var(--neon-blue); padding: 15px 30px; border-radius: 4px; box-shadow: var(--border-glow); width: 100%; max-width: 1100px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .telemetry #progressStatus { font-size: 2rem; color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); font-weight: 900; }
        .main-container { display: grid; grid-template-columns: 1fr 380px; gap: 25px; width: 100%; max-width: 1200px; }
        .canvas-section { background: #000; border: 2px solid #1a1a1a; border-radius: 4px; position: relative; min-height: 500px; display: flex; align-items: center; justify-content: center; }
        .chat-section { background: var(--panel-bg); border: 1px solid #222; display: flex; flex-direction: column; height: 550px; border-top: 3px solid var(--neon-blue); }
        #messages { flex-grow: 1; padding: 15px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 0.85rem; background: rgba(0,0,0,0.3); }
        .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--neon-red); }
        .dot.online { background: var(--neon-green); box-shadow: 0 0 20px var(--neon-green); }
        .btn { padding: 15px 35px; background: #000; border: 1px solid var(--neon-blue); color: var(--neon-blue); cursor: pointer; font-weight: bold; }
        #imagePreview, #videoPreview { max-width: 95%; max-height: 95%; display: none; border: 1px solid var(--neon-blue); }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="system-info">
            <h2>QUP CONSOLE | ZIEDZIZOU</h2>
            <div id="rotaryCounter">CLOCK: 0000000000</div>
        </div>
        <div class="telemetry">
            <div id="progressStatus">0%</div>
        </div>
        <div class="connection-status">
            <span id="statusText">FIREBASE SYNC...</span>
            <div id="connDot" class="dot"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="canvas-section">
            <div id="mediaPreviewContainer">
                <img id="imagePreview">
                <video id="videoPreview" controls></video>
                <div id="placeholderText" style="color: #222; font-size: 5rem; font-weight: 900; opacity: 0.1;">RADAR</div>
            </div>
        </div>
        <div class="chat-section">
            <div id="messages"></div>
            <div style="padding: 10px; background: #111; display: flex;">
                <input type="text" id="msgInput" style="flex:1; background:#000; color:#fff; border:1px solid #333; padding:10px;">
                <button id="sendMsgBtn" class="btn">بث</button>
            </div>
        </div>
    </div>

    <div class="bottom-controls">
        <label for="fileInput" style="cursor:pointer; border:1px solid #fff; padding:15px;">📁 اختيار مصفوفة</label>
        <input type="file" id="fileInput" style="display:none;">
        <button id="sendBtn" class="btn" style="border-color:var(--neon-green); color:var(--neon-green);" disabled>إطلاق النبضة</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // إعداداتك التي أرسلتها (Ziedzizou)
        const firebaseConfig = {
            apiKey: "AIzaSyAZs0bb_t-bzMtaJqy_W_QDBSdQKHLEiD4",
            authDomain: "ziedzizou-7b74d.firebaseapp.com",
            databaseURL: "https://ziedzizou-7b74d-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ziedzizou-7b74d",
            storageBucket: "ziedzizou-7b74d.firebasestorage.app",
            messagingSenderId: "937969676323",
            appId: "1:937969676323:web:8c89472de068a2e6cd0196"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pulseRef = ref(db, 'qup_pulses'); // القناة التي ستبث عبرها النبضات

        // دوال عالمية لملف Zied.js
        window.logToChat = (msg) => {
            const m = document.getElementById('messages');
            m.innerHTML += `<div>> ${msg}</div>`;
            m.scrollTop = m.scrollHeight;
        };

        window.updateProgressPulse = (ratio) => {
            document.getElementById('progressStatus').innerText = Math.floor(ratio * 100) + "%";
        };

        window.updateRotaryVisual = (tick) => {
            document.getElementById('rotaryCounter').innerText = `CLOCK: ${tick.toString().padStart(10, '0')}`;
        };

        // مراقبة حالة الاتصال بـ Firebase
        onValue(ref(db, '.info/connected'), (snap) => {
            const dot = document.getElementById('connDot');
            if (snap.val() === true) {
                dot.classList.add('online');
                document.getElementById('statusText').innerText = "ZIEDZIZOU LINK ACTIVE";
                window.logToChat("متصل بنجاح بقاعدة بيانات Ziedzizou.");
            }
        });

        // استلام النبضات من Firebase (بديل للسوكيت)
        onValue(pulseRef, (snapshot) => {
            const data = snapshot.val();
            if (data && window.processIncomingPulse) {
                window.processIncomingPulse(data); // دالة سنعرفها في Zied.js
            }
        });

        // اختيار الملف والمعاينة
        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('sendBtn').disabled = false;
            window.logToChat(`تم تحميل: ${file.name}`);
        };
    </script>

    <script type="module" src="Zied.js"></script>
</body>
</html>
