<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>النقل الآني للمصفوفة | Quantum Stream V3</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #00ff41; font-family: 'Courier New', monospace; }
        canvas { display: block; filter: contrast(1.2) brightness(1.2); }
        .ui-overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,20,0,0.8); padding: 15px; border: 1px solid #00ff41; z-index: 10; pointer-events: auto; }
        .status-bar { position: absolute; bottom: 10px; left: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
        input[type="file"] { display: none; }
        label { background: #004400; color: #00ff41; padding: 10px 20px; border: 1px solid #00ff41; cursor: pointer; margin-right: 10px; }
        .latency-meter { color: #fff; font-size: 10px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="ui-overlay">
    <label for="imageInput">📂 اختر المصدر الذري</label>
    <input type="file" id="imageInput" accept="image/*">
    <button id="igniteBtn">⚡ إطلاق النبضة (IGNITE)</button>
    <div id="stats" class="latency-meter">الحالة: خامل | السرعة: 0ms</div>
</div>

<div class="status-bar" id="status">النظام جاهز للاختراق الرقمي...</div>
<canvas id="teleportCanvas"></canvas>

<script>
    const SERVER_URL = "https://c7c9c05e-7071-4908-9616-f6be44817257-00-2eyc5vot02n45.worf.replit.dev";
    const socket = io(SERVER_URL, { 
        transports: ["websocket"], 
        upgrade: false,
        persist: false 
    });

    const canvas = document.getElementById('teleportCanvas');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    
    let ROWS = 250, COLS = 250;
    const CELL_SIZE = window.innerHeight / ROWS;
    canvas.width = COLS * CELL_SIZE;
    canvas.height = window.innerHeight;

    // ذاكرة العرض (الفيديو رام البرمجية)
    const videoRAM = new Uint8Array(ROWS * COLS);

    // --- استقبال النبضات (الطرف المستلم) ---
    socket.on("matrix-relay", (data) => {
        if (data.isAtomic && data.payload) {
            const rowData = new Uint8Array(data.payload);
            const startIdx = data.r * COLS;
            videoRAM.set(rowData, startIdx);
        }
    });

    // --- المحرك الرسومي (الرسم بسرعة 60 إطار/ثانية) ---
    function render() {
        // تأثير التلاشي السريع (Motion Blur)
        ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < videoRAM.length; i++) {
            const val = videoRAM[i];
            if (val > 0) {
                const r = Math.floor(i / COLS);
                const c = i % COLS;
                
                // هندسة اللون اللحظي
                ctx.fillStyle = `rgb(0, ${val * 16}, ${val * 4})`;
                ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 0.5, CELL_SIZE - 0.5);
            }
        }
        requestAnimationFrame(render);
    }
    render();

    // --- بروتوكول الإشعاع (الطرف المرسل) ---
    document.getElementById('igniteBtn').onclick = () => {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return alert("قم بتغذية النظام بصورة أولاً!");

        const img = new Image();
        img.src = URL.createObjectURL(file);
        
        img.onload = () => {
            const start = performance.now();
            document.getElementById('status').innerText = "🚀 تجري الآن عملية النقل التزامني...";
            
            // إنشاء معالج ذري غير مرئي
            const processor = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
            processor.canvas.width = COLS;
            processor.canvas.height = ROWS;
            processor.drawImage(img, 0, 0, COLS, ROWS);

            // البث السطري الفوري (Row-by-Row Atomic Streaming)
            for (let r = 0; r < ROWS; r++) {
                const imgData = processor.getImageData(0, r, COLS, 1).data;
                const rowBuffer = new Uint8Array(COLS);

                for (let c = 0; c < COLS; c++) {
                    const idx = c * 4;
                    // تحويل السطوع فوراً (Greyscale Optimization)
                    rowBuffer[c] = (imgData[idx] * 0.299 + imgData[idx+1] * 0.587 + imgData[idx+2] * 0.114) / 16;
                }

                // قذف البيانات إلى الأنبوب الرقمي فوراً
                socket.emit("matrix-relay", {
                    r: r,
                    payload: rowBuffer.buffer, // إرسال ArrayBuffer خام لسرعة البرق
                    isAtomic: true
                });
            }

            const end = performance.now();
            document.getElementById('stats').innerText = `زمن المعالجة: ${(end - start).toFixed(2)}ms | الدقة: 250x250`;
            document.getElementById('status').innerText = "✅ اكتمل النقل الآني بنجاح";
        };
    };

    // مزامنة أبعاد الشاشة
    window.onresize = () => {
        canvas.width = COLS * (window.innerHeight / ROWS);
        canvas.height = window.innerHeight;
    };
</script>

</body>
</html>
