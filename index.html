<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Twin Assembly Plant v10.0</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .factory-floor { border: 2px solid #00ff41; padding: 20px; width: 600px; background: #000; box-shadow: 0 0 40px rgba(0,255,65,0.2); }
        .assembly-grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 2px; 
            margin-top: 20px; 
            background: #111; 
            border: 1px solid #333;
            min-height: 300px;
        }
        .part { width: 100%; padding-top: 100%; background: #002200; border: 1px solid #004400; transition: 0.3s; }
        .part.active { background: #00ff41; box-shadow: 0 0 10px #00ff41; }
        .status-panel { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; border-bottom: 1px solid #00ff41; padding-bottom: 5px; }
        .log { font-size: 11px; height: 80px; overflow-y: auto; background: #080808; padding: 10px; margin-top: 10px; border: 1px solid #222; }
    </style>
</head>
<body>

    <div class="factory-floor">
        <div class="status-panel">
            <span>PLANT_STATUS: RUNNING</span>
            <span>PARTS_SYNCED: <span id="sync-count">0</span>/100</span>
        </div>

        <input type="file" id="workerInput" style="color:#00ff41;">
        
        <div class="assembly-grid" id="grid">
            </div>

        <div class="log" id="terminal">AWAITING_SHIPMENT_DETAILS...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
          storageBucket: "zied-e3b78.firebasestorage.app",
          messagingSenderId: "774724725374",
          appId: "1:774724725374:web:a338e16e8689d60dd3062f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // إنشاء شبكة المصنع (100 قطعة للتركيب)
        const grid = document.getElementById('grid');
        for(let i=0; i<100; i++) {
            const div = document.createElement('div');
            div.className = 'part';
            div.id = `part-${i}`;
            grid.appendChild(div);
        }

        let localT = 0;

        // --- وظيفة التوأم المستلم: التركيب المحلي بدون نات ---
        onValue(ref(db, "temporal/stream"), (snap) => {
            const parts = snap.val();
            if (parts) {
                let count = 0;
                Object.keys(parts).forEach(key => {
                    const data = parts[key];
                    // التركيب محلياً: تفعيل الجزء المطابق للرقم المستلم
                    const element = document.getElementById(`part-${data.id}`);
                    if (element && !element.classList.contains('active')) {
                        element.classList.add('active');
                        count++;
                    }
                });
                document.getElementById('sync-count').innerText = Object.keys(parts).length;
                document.getElementById('terminal').innerHTML += `PART_INSTALLED_LOCALLY: ID_${count}<br>`;
            }
        });

        // --- وظيفة المرسل: تفكيك وإرسال أرقام القطع فقط ---
        document.getElementById('workerInput').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // تنظيف المصنع للبدء من جديد
            document.querySelectorAll('.part').forEach(p => p.classList.remove('active'));
            
            // محاكاة تفكيك الملف إلى 100 قطعة معلوماتية
            for (let i = 0; i < 100; i++) {
                // نرسل فقط رقم القطعة (ID) وإحداثية حتمية بسيطة
                const partData = {
                    id: i,
                    ts: Date.now(),
                    h: (file.size * i) % 360 // لون حتمي للقطعة
                };

                // إرسال "أمر التركيب" للسيرفر
                await set(ref(db, `temporal/stream/p_${i}`), partData);
                
                // تأخير بسيط لمحاكاة "العمال" وهم يرسلون القطع واحدة تلو الأخرى
                await new Promise(r => setTimeout(r, 50));
            }
            await set(ref(db, "temporal/counter"), Date.now());
        };
    </script>
</body>
</html>
