<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⏳ Temporal Numeric Stream</title>
<style>
body {
  background:#000;
  color:#0f0;
  font-family: monospace;
  text-align:center;
  padding-top:20px;
}
#counter { font-size:64px; margin:20px; }
#chat {
  font-size:22px;
  color:#ff0;
  margin:20px auto;
  width:80%;
  max-height:300px;
  overflow-y:auto;
  text-align:left;
  border:1px solid #0f0;
  padding:10px;
  white-space:pre-wrap;
}
input[type=text] { width:50%; font-size:18px; padding:8px; }
button {
  font-size:16px;
  padding:8px 16px;
  margin:5px;
  background:#003300;
  color:#0f0;
  border:1px solid #0f0;
}
a { color:#0ff; display:block; margin-top:10px; }
img, video {
  max-width:100%;
  display:block;
  margin-top:10px;
  border:1px solid #0f0;
}
</style>
</head>
<body>

<h2>⏳ بث عددي زمني</h2>
<div id="counter">0</div>

<div id="chat"></div>

<input id="input" placeholder="اكتب أي شيء">
<button id="sendBtn">إرسال</button>
<button id="fileBtn">إرسال ملف</button>
<button id="clearBtn">🗑 حذف الكل</button>
<button id="leaderBtn">▶ تشغيل العداد</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ================= Firebase =================
const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain: "setouchi-it.firebaseapp.com",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "setouchi-it",
  storageBucket: "setouchi-it.appspot.com",
  messagingSenderId: "456612217542",
  appId: "1:456612217542:web:51d963523b1306e0bf4dc7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const counterRef = ref(db, "temporal/counter");
const leaderRef  = ref(db, "temporal/leader");
const streamRef  = ref(db, "temporal/stream");

// ================= DOM =================
const counterDiv = document.getElementById("counter");
const chatDiv = document.getElementById("chat");
const input = document.getElementById("input");
const leaderBtn = document.getElementById("leaderBtn");

let localInterval = null;
let isLeader = false;

// ================= Client ID =================
if(!sessionStorage.getItem("clientId")){
  sessionStorage.setItem("clientId", "c_" + Date.now() + "_" + Math.random());
}
const clientId = sessionStorage.getItem("clientId");

// ================= Leader =================
onValue(leaderRef, snap=>{
  isLeader = snap.val() === clientId;
  leaderBtn.textContent = isLeader ? "⏸ إيقاف العداد" : "▶ تشغيل العداد";
});

leaderBtn.onclick = async ()=>{
  if(isLeader){
    clearInterval(localInterval);
    localInterval = null;
    await set(leaderRef, null);
  } else {
    await set(leaderRef, clientId);
    startCounter();
  }
};

// ================= Counter =================
onValue(counterRef, snap=>{
  if(snap.val() !== null){
    counterDiv.textContent = snap.val();
  }
});

function startCounter(){
  if(localInterval) return;
  localInterval = setInterval(async ()=>{
    const v = parseInt(counterDiv.textContent || "0", 10) + 1;
    await set(counterRef, v);
  }, 600);
}

// ================= Numeric Stream (READER) =================
onValue(streamRef, snap=>{
  const data = snap.val() || {};
  const ticks = Object.keys(data).sort((a,b)=>{
    return parseInt(a.split("_")[1]) - parseInt(b.split("_")[1]);
  });

  let textOut = "";
  const bytes = [];

  ticks.forEach(t=>{
    const v = data[t];
    if(v <= 255){
      bytes.push(v);
    } else {
      textOut += String.fromCharCode(v);
    }
  });

  chatDiv.innerHTML = "";
  if(textOut) {
    chatDiv.textContent = textOut;
  }

  if(bytes.length > 0){
    const blob = new Blob([new Uint8Array(bytes)], { type: "image/*" }); // 🔥 عرض تلقائي للصورة
    const url = URL.createObjectURL(blob);

    // رابط تحميل دائم
    const link = document.createElement("a");
    link.href = url;
    link.download = "generated.bin";
    link.textContent = "⬇ تحميل الملف المولّد";
    chatDiv.appendChild(link);

    // عرض تلقائي كصورة
    const img = document.createElement("img");
    img.src = url;
    img.onload = ()=> chatDiv.appendChild(img);
    img.onerror = ()=>{}; // إذا لم تكن صورة، لا يحدث شيء
  }

  chatDiv.scrollTop = chatDiv.scrollHeight;
});

// ================= Send Text =================
document.getElementById("sendBtn").onclick = async ()=>{
  const value = input.value;
  if(!value) return;

  let tick = parseInt(counterDiv.textContent || "0", 10);

  for(const ch of value){
    tick++;
    const code = ch.charCodeAt(0);
    await set(ref(db, `temporal/stream/tick_${tick}`), code);
    await set(counterRef, tick);
  }

  input.value = "";
};

// ================= Send File (PURE BYTES) =================
document.getElementById("fileBtn").onclick = ()=>{
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = async evt=>{
      const arr = new Uint8Array(evt.target.result);
      let tick = parseInt(counterDiv.textContent || "0", 10);

      for(const byte of arr){
        tick++;
        await set(ref(db, `temporal/stream/tick_${tick}`), byte);
        await set(counterRef, tick);
      }
    };
    reader.readAsArrayBuffer(file);
  };
  fileInput.click();
};

// ================= Clear =================
document.getElementById("clearBtn").onclick = async ()=>{
  await set(streamRef, null);
  await set(counterRef, 0);
};
</script>

</body>
</html>
