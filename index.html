<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Universal Moment Translator – Socket.IO</title>
<style>
body { margin:0; font-family: monospace; background:#000; color:#0f0; text-align:center; }
#momentDisplay { font-size:64px; margin:20px; }
#localQueue { margin:20px; max-height:300px; overflow-y:auto; border:1px solid #0f0; padding:10px; text-align:left; }
input, button { font-size:18px; margin:5px; padding:5px; }
canvas { display:block; margin:auto; background:#111; border:1px solid #0f0; }
</style>
</head>
<body>

<h2>⏳ Universal Moment Translator – Local Interface</h2>
<div id="momentDisplay">0</div>

<input id="textInput" placeholder="اكتب حرف أو كلمة">
<button id="addTextBtn">إضافة نص</button>
<button id="addFileBtn">إضافة ملف محلي</button>
<button id="clearBtn">🗑 مسح كل المحتوى المحلي</button>

<div id="localQueue"></div>

<canvas id="canvas" width="256" height="256"></canvas>

<script type="module">
import { UniversalMomentTranslator } from './universal-moment-translator.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ===============================
   Firebase Initialization
=============================== */
const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain: "setouchi-it.firebaseapp.com",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "setouchi-it",
  storageBucket: "setouchi-it.appspot.com",
  messagingSenderId: "456612217542",
  appId: "1:456612217542:web:51d963523b1306e0bf4dc7"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const momentRef = ref(db, 'temporal/tick');
const leaderRef = ref(db, 'temporal/leader');

/* ===============================
   Local Buffers
=============================== */
const localQueue = [];
const queueDiv = document.getElementById('localQueue');
function updateQueueDisplay() {
    queueDiv.innerHTML = localQueue.map((item,i)=>`[${i}] ${item.type}: ${item.value}`).join('<br>');
}

/* ===============================
   Canvas & Translator
=============================== */
const canvas = document.getElementById('canvas');
const translator = new UniversalMomentTranslator(canvas, localQueue);

/* ===============================
   Moment Observer
=============================== */
const momentDisplay = document.getElementById('momentDisplay');
onValue(momentRef, snapshot=>{
    const value = snapshot.val() ?? 0;
    momentDisplay.textContent = value;
    translator.onMoment(value);
});

/* ===============================
   Leader Election & Tick Increment
=============================== */
let isLeader = false;

async function tryBecomeLeader() {
    const snapshot = await get(leaderRef);
    if (!snapshot.exists()) {
        await set(leaderRef, true);
        isLeader = true;
        console.log("🌟 This client is now the Leader.");
        startTick();
    } else {
        console.log("⏳ This client is a follower.");
    }
}

function startTick() {
    setInterval(async ()=>{
        const snapshot = await get(momentRef);
        const current = snapshot.exists() ? snapshot.val() : 0;
        await set(momentRef, current + 1);
    }, 100); // granularity
}

tryBecomeLeader();

/* ===============================
   Input Handlers (Local Only)
=============================== */
document.getElementById('addTextBtn').onclick = ()=>{
    const val = document.getElementById('textInput').value.trim();
    if(!val) return;
    localQueue.push({type:'text', value: val});
    updateQueueDisplay();
    document.getElementById('textInput').value = '';
};

document.getElementById('addFileBtn').onclick = ()=>{
    const input = document.createElement('input');
    input.type='file';
    input.onchange = e=>{
        const file = e.target.files[0];
        if(!file) return;
        localQueue.push({type:'file', value:file.name});
        updateQueueDisplay();
    };
    input.click();
};

document.getElementById('clearBtn').onclick = ()=>{
    localQueue.length=0;
    updateQueueDisplay();
};

</script>
</body>
</html>
