<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Twin Engine v8.0 - Fingerprint Only</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .engine-box { border: 1px solid #00ff41; padding: 25px; border-radius: 12px; width: 500px; background: #000; box-shadow: 0 0 30px rgba(0,255,65,0.1); text-align: center; }
        .status-bar { font-size: 11px; border-bottom: 1px solid #1a1a1a; margin-bottom: 20px; padding-bottom: 10px; color: #008f11; display: flex; justify-content: space-between; }
        .terminal-log { font-size: 14px; color: #00ff41; background: #0a0a0a; padding: 20px; border-radius: 5px; text-align: left; direction: ltr; margin-top: 15px; border: 1px solid #00ff41; }
        .controls { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        input[type="file"] { color: #00ff41; }
        .btn-reset { background: #ff4b2b; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-family: inherit; font-weight: bold; }
        /* وسم الصورة الجديد للعرض الفوري */
        #displayZone { margin-top: 20px; max-width: 100%; border-radius: 8px; border: 1px solid #333; display: none; }
    </style>
</head>
<body>

    <div class="engine-box">
        <div class="status-bar">
            <span>PROTOCOL: FINGERPRINT_SYNC</span>
            <span>T: <span id="t-val">0</span></span>
        </div>
        
        <div class="controls">
            <input type="file" id="filePicker">
            <button id="globalDelete" class="btn-reset">RESET_FINGERPRINT</button>
        </div>

        <img id="displayZone" alt="Preview">

        <div class="terminal-log" id="log">
            AWAITING_LOCAL_STATE...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
          storageBucket: "zied-e3b78.firebasestorage.app",
          messagingSenderId: "774724725374",
          appId: "1:774724725374:web:a338e16e8689d60dd3062f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const PATHS = { counter: "temporal/counter", stream: "temporal/stream" };

        let localT = 0;

        class FingerprintEngine {
            static async generate(file, T) {
                const buffer = await file.arrayBuffer();
                const Qlen = buffer.byteLength;
                
                const s = (T * 31 + Qlen * 7) % Qlen;
                const e = (T * 17 + Qlen * 13) % Qlen;
                const m = Math.floor((s + e) / 2);

                // عرض محلي فوري للمرسل
                const imgDisplay = document.getElementById("displayZone");
                imgDisplay.src = URL.createObjectURL(file);
                imgDisplay.style.display = "block";

                return { L: Qlen, T: T, S: s, M: m, A: e };
            }

            static sync(data) {
                document.getElementById("log").innerHTML = `
                    [SYNC_LOCKED]<br>
                    ----------------<br>
                    L (Length): ${data.L}<br>
                    S (Start) : ${data.S}<br>
                    M (Mid)   : ${data.M}<br>
                    A (And)   : ${data.A}<br>
                    T (Time)  : ${data.T}
                `;
                // الطرف التوأم سيعرض الصورة هنا إذا كانت موجودة في ذاكرته المحلية
                console.log("Twin matching local file with length:", data.L);
            }
        }

        onValue(ref(db, PATHS.counter), async (snap) => {
            const sT = snap.val();
            if (sT && sT > localT) {
                const sSnap = await get(ref(db, `${PATHS.stream}/state_${sT}`));
                const fingerprint = sSnap.val();
                if (fingerprint) {
                    FingerprintEngine.sync(fingerprint);
                    localT = sT;
                    document.getElementById("t-val").innerText = sT;
                }
            } else if (sT === 0) {
                document.getElementById("log").innerText = "STREAM_VACUUMED.";
                document.getElementById("displayZone").style.display = "none";
                document.getElementById("t-val").innerText = "0";
                localT = 0;
            }
        });

        document.getElementById('filePicker').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const counterSnap = await get(ref(db, PATHS.counter));
            const nextT = (counterSnap.val() || 0) + 1;

            const fingerprint = await FingerprintEngine.generate(file, nextT);
            
            await set(ref(db, `${PATHS.stream}/state_${nextT}`), fingerprint);
            await set(ref(db, PATHS.counter), nextT);
            localT = nextT;
        };

        document.getElementById('globalDelete').onclick = async () => {
            await set(ref(db, PATHS.counter), 0);
            await remove(ref(db, PATHS.stream));
        };
    </script>
</body>
</html>
