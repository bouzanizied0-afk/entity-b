<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Twin Engine v2.2 - Path Connected</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إحداثيات المسار الرقمي
        const firebaseConfig = {
            databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pathRef = ref(db, "global_twin_path");

        // وظيفة بث المعادلة إلى المسار
        window.broadcastToPath = (equation, fileMeta, content) => {
            set(pathRef, {
                formula: equation,
                meta: fileMeta,
                data: content, // المادة الخام مشفرة
                senderId: Math.random().toString(36).substring(7),
                timestamp: Date.now()
            });
        };

        // وظيفة الاستماع للمسار (التجسيد عند الطرف الآخر)
        onValue(pathRef, (snapshot) => {
            const val = snapshot.val();
            if (val && !window.currentSender) {
                window.triggerReconstruction(val);
            }
        });
    </script>

    <style>
        :root { --secure-green: #00ff41; --bg-black: #050505; }
        body { background: var(--bg-black); color: var(--secure-green); font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .core-container { border: 2px solid var(--secure-green); padding: 30px; width: 450px; box-shadow: 0 0 20px rgba(0,255,65,0.2); background: #000; text-align: center; }
        .terminal { height: 120px; background: #000; border: 1px solid #111; padding: 10px; font-size: 12px; overflow-y: auto; margin: 15px 0; border-right: 3px solid var(--secure-green); text-align: right; }
        .btn-instant { background: var(--secure-green); color: #000; border: none; padding: 15px; width: 100%; font-weight: 900; cursor: pointer; }
        .btn-instant:hover { background: #fff; }
    </style>
</head>
<body>

<div class="core-container">
    <div style="font-size: 10px; border: 1px solid var(--secure-green); padding: 5px; margin-bottom: 15px;">STATUS: PATH_SYNC_ACTIVE</div>
    <h2 style="margin: 0;">المحرك التوأم (الربط العالمي)</h2>
    
    <div class="terminal" id="term"> [SYSTEM] بانتظار إشارة من المسار... </div>

    <input type="file" id="inputSrc" style="display:none">
    <button class="btn-instant" id="mainBtn">تفكيك المادة وبثها</button>
    
    <div id="statusInfo" style="margin-top:15px; font-size:11px; color:#888;">
        زمن التزامن: <span id="syncTime">0ms</span> | الخطأ: 0%
    </div>
</div>

<script>
    const term = document.getElementById('term');
    const inputSrc = document.getElementById('inputSrc');
    const mainBtn = document.getElementById('mainBtn');
    
    window.currentSender = false;

    function log(msg, color = "#00ff41") {
        term.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
        term.scrollTop = term.scrollHeight;
    }

    mainBtn.onclick = () => inputSrc.click();

    inputSrc.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        window.currentSender = true; // علامة لكي لا يعيد الجهاز تركيب ملفه هو
        log(`بدء تفكيك: ${file.name}...`);

        const reader = new FileReader();
        reader.onload = (ev) => {
            const raw = ev.target.result;
            const equation = "IT_" + btoa(file.name).substring(0, 8).toUpperCase();
            
            // تحويل البيانات لبثها عبر المسار
            const base64 = btoa(String.fromCharCode(...new Uint8Array(raw)));
            
            log("تم استخراج المعادلة. جاري البث عبر المسار...");
            window.broadcastToPath(equation, {name: file.name, type: file.type}, base64);
            
            setTimeout(() => { window.currentSender = false; }, 3000);
        };
        reader.readAsArrayBuffer(file);
    };

    window.triggerReconstruction = (packet) => {
        log(`استلام إشارة! تجسيد ملف: ${packet.meta.name}`, "#fff");
        
        // عملية التركيب الفوري (العودة من المادة الرقمية)
        const binary = atob(packet.data);
        const array = new Uint8Array(binary.length);
        for(let i=0; i<binary.length; i++) array[i] = binary.charCodeAt(i);
        
        const blob = new Blob([array], {type: packet.meta.type});
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = "TWIN_" + packet.meta.name;
        a.click();
        
        log("اكتمل التجسيد بنجاح مطبق.", "#00ff41");
    };
</script>
</body>
</html>
