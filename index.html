<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام التزامن التلقائي الفوري</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #00d4ff; display: flex; flex-direction: column; align-items: center; padding: 30px; }
        .container { background: #111; padding: 25px; border-radius: 15px; border: 1px solid #00d4ff; width: 450px; text-align: center; box-shadow: 0 0 25px rgba(0,212,255,0.2); }
        .server-status { background: #000; padding: 5px; border-radius: 5px; font-family: monospace; font-size: 12px; margin-bottom: 20px; color: #555; }
        input[type="file"] { margin: 20px 0; color: #00d4ff; }
        #resultImg { display: none; margin-top: 20px; max-width: 100%; border: 2px solid #00d4ff; border-radius: 10px; animation: fadeIn 0.5s; }
        .status { margin-top: 15px; font-size: 0.9em; color: #888; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .loader { display: none; margin: 10px auto; border: 3px solid #333; border-top: 3px solid #00d4ff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="server-status">قناة المزامنة: <span id="serverTimer">0</span></div>
        <h2>تزامن تلقائي (بث حي)</h2>
        
        <input type="file" id="fileInput" accept="image/*">
        
        <div class="loader" id="loader"></div>
        <div id="statusText" class="status">في انتظار بيانات...</div>
        
        <img id="resultImg" alt="الصورة المستلمة">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
            authDomain: "zied-e3b78.firebaseapp.com",
            databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "zied-e3b78",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let localT = 0;

        // 1. تحديث عداد الخادم للتحقق من الاتصال
        onValue(ref(db, "system/heartbeat"), (s) => document.getElementById("serverTimer").innerText = s.val() || 0);

        // 2. الاستماع والمزامنة التلقائية (الميزة المطلوبة)
        onValue(ref(db, "temporal/counter"), async (snap) => {
            const serverT = snap.val();
            
            if (serverT && serverT > localT) {
                localT = serverT;
                
                document.getElementById("statusText").innerText = "جاري جلب الصورة تلقائياً...";
                document.getElementById("loader").style.display = "block";

                const stateSnap = await get(ref(db, `temporal/stream/state_${serverT}`));
                const incomingState = stateSnap.val();

                if (incomingState) {
                    const imgElement = document.getElementById("resultImg");
                    imgElement.src = `data:${incomingState.type};base64,${incomingState.data}`;
                    imgElement.style.display = "block";
                    
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("statusText").innerText = "تم استلام صورة جديدة وتحديثها.";
                }
            }
        });

        // 3. عملية الإرسال
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById("statusText").innerText = "جاري معالجة الصورة وإرسالها...";
            document.getElementById("loader").style.display = "block";

            const reader = new FileReader();
            reader.onload = async (event) => {
                const base64Data = btoa(String.fromCharCode.apply(null, new Uint8Array(event.target.result)));

                const counterSnap = await get(ref(db, "temporal/counter"));
                const nextT = (counterSnap.val() || 0) + 1;

                const payload = {
                    data: base64Data,
                    T: nextT,
                    type: file.type
                };

                await set(ref(db, `temporal/stream/state_${nextT}`), payload);
                await set(ref(db, "temporal/counter"), nextT);
                
                localT = nextT;
                document.getElementById("loader").style.display = "none";
                document.getElementById("statusText").innerText = "تم الإرسال بنجاح.";
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
