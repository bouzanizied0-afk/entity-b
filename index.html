<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام تزامن الحالات الحتمي (DSS)</title>
    <style>
        body { font-family: monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 30px; }
        .container { background: #0a0a0a; padding: 25px; border: 1px solid #00ff41; width: 500px; text-align: center; box-shadow: 0 0 15px #00ff4133; }
        .server-status { color: #555; font-size: 11px; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        input[type="file"] { margin: 20px 0; color: #00ff41; font-size: 12px; }
        #canvas-output { border: 1px solid #00ff41; margin-top: 20px; display: none; background: #000; }
        .status { margin-top: 15px; font-size: 0.8em; color: #00ff41; opacity: 0.7; }
        .terminal-text { text-align: left; direction: ltr; font-size: 10px; color: #888; margin-top: 10px; height: 50px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="container">
        <div class="server-status">NODE_SYNC_T: <span id="serverTimer">0</span></div>
        <h3>SYSTEM: STATE SYNCHRONIZATION</h3>
        
        <input type="file" id="fileInput" accept="image/*">
        
        <div id="statusText" class="status">READY: IDLE</div>
        <canvas id="canvas-output"></canvas>
        <div id="terminal" class="terminal-text"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
            authDomain: "zied-e3b78.firebaseapp.com",
            databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "zied-e3b78"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const canvas = document.getElementById('canvas-output');
        const ctx = canvas.getContext('2d');

        let localT = 0;

        // --- 1. التفكيك المحلي والتوليد (Local Decomposition & State Equation) ---
        function generateStateEquation(fileData, T) {
            const Q = new Uint8Array(fileData);
            const length = Q.length;
            
            // معادلة الحالة: استخراج مؤشرات رقمية فقط
            return {
                start: (Q[0] * T) % 255,
                mid: Q[Math.floor(length / 2)],
                end: Q[length - 1],
                size: length,
                entropy: Q.reduce((a, b) => a + b, 0) % 1000,
                T: T
            };
        }

        // --- 2. إعادة البناء الحتمية (Deterministic Reconstruction) ---
        function reconstructFromState(state) {
            document.getElementById("terminal").innerText += `\nRECONSTRUCTING T:${state.T} [S:${state.start} M:${state.mid} E:${state.end}]`;
            
            // إعادة بناء الحالة بصرياً بناءً على الإحداثيات فقط (لا يوجد نقل بايتات)
            canvas.width = 300;
            canvas.height = 200;
            canvas.style.display = "block";

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, `rgb(${state.start}, ${state.mid}, ${state.end})`);
            gradient.addColorStop(1, `rgb(${state.end}, ${state.start}, ${state.mid})`);
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // رسم تجريدي حتمي يمثل "بصمة الحالة"
            ctx.strokeStyle = "#00ff41";
            ctx.beginPath();
            ctx.moveTo(state.start % 300, 0);
            ctx.lineTo(state.mid % 300, 100);
            ctx.lineTo(state.end % 300, 200);
            ctx.stroke();
        }

        // --- 3. المزامنة عبر الشبكة (Synchronization) ---
        onValue(ref(db, "system/heartbeat"), (s) => document.getElementById("serverTimer").innerText = s.val() || 0);

        onValue(ref(db, "temporal/counter"), async (snap) => {
            const serverT = snap.val();
            if (serverT && serverT > localT) {
                localT = serverT;
                
                const stateSnap = await get(ref(db, `temporal/stream/state_${serverT}`));
                const remoteState = stateSnap.val();

                if (remoteState) {
                    document.getElementById("statusText").innerText = "STATE_SYNC: MATCHED";
                    reconstructFromState(remoteState);
                }
            }
        });

        // --- 4. الإدخال والإرسال (Input & Broadcast) ---
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById("statusText").innerText = "DECOMPOSING...";
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                const counterSnap = await get(ref(db, "temporal/counter"));
                const nextT = (counterSnap.val() || 0) + 1;

                // التفكيك إلى معادلة
                const stateEquation = generateStateEquation(event.target.result, nextT);

                // إرسال الإحداثيات فقط (الخادم أعمى)
                await set(ref(db, `temporal/stream/state_${nextT}`), stateEquation);
                await set(ref(db, "temporal/counter"), nextT);
                
                localT = nextT;
                document.getElementById("statusText").innerText = "STATE_BROADCAST: OK";
                reconstructFromState(stateEquation);
            };
            reader.readAsArrayBuffer(file);
        });

    </script>
</body>
</html>
