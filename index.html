<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⏳ Temporal Chat</title>
<style>
body { background:#000; color:#0f0; font-family: monospace; text-align:center; }
#tick { font-size:64px; margin:20px; }
#chat { font-size:22px; max-height:400px; overflow-y:auto; }
</style>
</head>
<body>

<h2>⏳ الزمن المشترك</h2>
<div id="tick">?</div>
<div id="chat"></div>

<input id="messageInput" placeholder="اكتب رسالة">
<button onclick="sendMessage()">إرسال</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, push, onValue, onChildAdded
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 🔹 الاستماع للزمن (من الخادم)
const clockRef = ref(db, "system/clock");
onValue(clockRef, snap => {
  if (snap.exists()) {
    document.getElementById("tick").textContent = snap.val().tick;
  }
});

// 🔹 الرسائل
const msgRef = ref(db, "messages");
onChildAdded(msgRef, snap => {
  const div = document.createElement("div");
  div.textContent = snap.val().text;
  document.getElementById("chat").appendChild(div);
});

// 🔹 إرسال رسالة (طلب فقط)
window.sendMessage = () => {
  const input = document.getElementById("messageInput");
  if (!input.value.trim()) return;

  push(ref(db, "outbox"), {
    text: input.value.trim(),
    createdAt: Date.now()
  });

  input.value = "";
};
</script>
</body>
</html>
