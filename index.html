<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بوابة المصفوفة V6.1 | محرك الاستدعاء الذاتي</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; color: #00ff41; }
        canvas { border: 1px solid #003300; box-shadow: 0 0 30px rgba(0, 255, 65, 0.3); background: #000; image-rendering: pixelated; }
        .main-ui { position: absolute; background: rgba(0, 10, 0, 0.85); padding: 20px; border: 1px solid #00ff41; display: flex; flex-direction: column; gap: 12px; align-items: center; z-index: 100; }
        .status-led { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        .led { width: 10px; height: 10px; border-radius: 50%; background: #300; }
        .led.online { background: #00ff41; box-shadow: 0 0 10px #00ff41; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 25px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        #stats { font-size: 9px; color: #fff; margin-top: 5px; }
        input[type="file"] { display: none; }
        label { color: #00ff41; padding: 8px; border: 1px dashed #00ff41; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="main-ui">
    <div class="status-led">
        <div id="led" class="led"></div>
        <span id="connStatus">جهاز الاستقبال خامل</span>
    </div>
    <label for="imageInput">📂 تلقيم المصدر الذري</label>
    <input type="file" id="imageInput" accept="image/*">
    <button id="igniteBtn">⚡ إطلاق السيل المرمم</button>
    <div id="stats">READY FOR RECONSTRUCTION</div>
</div>

<canvas id="matrixCanvas"></canvas>

<script>
    const SERVER_URL = "https://c7c9c05e-7071-4908-9616-f6be44817257-00-2eyc5vot02n45.worf.replit.dev";
    const socket = io(SERVER_URL, { transports: ["websocket"], upgrade: false });

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    const ROWS = 200, COLS = 200;
    const CELL_SIZE = 3;
    canvas.width = COLS * CELL_SIZE;
    canvas.height = ROWS * CELL_SIZE;

    let liveMatrix = Array.from({length: ROWS}, () => new Uint8Array(COLS));
    let receivedRows = new Set();
    let auditTimer; // تايمر الجرد
    let processor; // تعريف المعالج بشكل عام ليكون متاحاً لإعادة الإرسال

    socket.on("connect", () => {
        document.getElementById('led').classList.add('online');
        document.getElementById('connStatus').innerText = "البوابة نشطة";
    });

    // --- استقبال مدمج مع نظام الجرد ---
    socket.on("matrix-relay", (data) => {
        if (data.isAtomic && data.payload) {
            const r = data.r;
            const payload = new Uint8Array(data.payload);
            liveMatrix[r] = payload;
            receivedRows.add(r);

            if (r > 0 && !receivedRows.has(r - 1)) {
                liveMatrix[r - 1] = new Uint8Array(payload); 
            }

            // تصفير عداد الجرد مع كل نبضة واصلة
            clearTimeout(auditTimer);
            auditTimer = setTimeout(auditAndRequestGaps, 1500);
        }
    });

    // --- مستمع طلبات إعادة الاستدعاء (عند المرسل) ---
    socket.on("request-reconciliation", (data) => {
        if (data.gaps && data.gaps.length > 0 && processor) {
            document.getElementById('stats').innerText = `🔄 ترميم ${data.gaps.length} صف مفقود...`;
            data.gaps.forEach(r => {
                const imgData = processor.getImageData(0, r, COLS, 1).data;
                const rowBuffer = new Uint8Array(COLS);
                for (let c = 0; c < COLS; c++) {
                    const idx = c << 2;
                    const brightness = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
                    rowBuffer[c] = (brightness | 0) >> 4;
                }
                socket.emit("matrix-relay", { r: r, payload: Array.from(rowBuffer), isAtomic: true });
            });
        }
    });

    function auditAndRequestGaps() {
        let missingRows = [];
        for (let i = 0; i < ROWS; i++) {
            if (!receivedRows.has(i)) missingRows.push(i);
        }
        if (missingRows.length > 0) {
            socket.emit("request-reconciliation", { gaps: missingRows });
        } else if (receivedRows.size > 0) {
            document.getElementById('stats').innerText = "✅ المصفوفة مكتملة 100%";
        }
    }

    function render() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let r = 0; r < ROWS; r++) {
            const row = liveMatrix[r];
            for (let c = 0; c < COLS; c++) {
                const val = row[c];
                if (val > 0) {
                    ctx.fillStyle = `rgb(0, ${val << 4}, 65)`;
                    ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE - 0.5, CELL_SIZE - 0.5);
                }
            }
        }
        requestAnimationFrame(render);
    }
    render();

    document.getElementById('igniteBtn').onclick = () => {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return;

        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
            // استخدام المعالج العام
            processor = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
            processor.canvas.width = COLS;
            processor.canvas.height = ROWS;
            processor.drawImage(img, 0, 0, COLS, ROWS);

            liveMatrix = Array.from({length: ROWS}, () => new Uint8Array(COLS));
            receivedRows.clear();

            let sequence = [];
            sequence.push(0, ROWS - 1, Math.floor(ROWS / 2));
            for (let i = 1; i < ROWS - 1; i++) {
                if (i !== Math.floor(ROWS / 2)) sequence.push(i);
            }

            let index = 0;
            function burstStream() {
                if (index >= sequence.length) {
                    document.getElementById('stats').innerText = "✅ إرسال السيل الأولي";
                    return;
                }
                const r = sequence[index];
                const imgData = processor.getImageData(0, r, COLS, 1).data;
                const rowBuffer = new Uint8Array(COLS);
                for (let c = 0; c < COLS; c++) {
                    const idx = c << 2;
                    const brightness = (imgData[idx] + imgData[idx+1] + imgData[idx+2]) / 3;
                    rowBuffer[c] = (brightness | 0) >> 4;
                }
                socket.emit("matrix-relay", { r: r, payload: Array.from(rowBuffer), isAtomic: true });
                index++;
                if (index % 5 === 0) requestAnimationFrame(burstStream);
                else burstStream();
            }
            document.getElementById('stats').innerText = "🚀 جاري البث الهيكلي...";
            burstStream();
        };
    };
</script>
</body>
</html>
