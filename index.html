<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUP Unified Console | مركز التحكم الموحد</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-green: #00ff41;
            --neon-red: #ff3131;
            --dark-bg: #050505;
            --panel-bg: rgba(10, 10, 15, 0.9);
            --border-glow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        body {
            background: var(--dark-bg);
            background-image: radial-gradient(circle at center, #111 0%, #050505 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Dashboard Header */
        .dashboard {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            padding: 15px 30px;
            border-radius: 4px;
            box-shadow: var(--border-glow);
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-right: 5px solid var(--neon-blue);
        }

        .system-info h2 { margin: 0; font-size: 1.2rem; color: var(--neon-blue); letter-spacing: 2px; }
        #rotaryCounter { font-family: 'Courier New', monospace; color: var(--neon-blue); font-size: 0.9rem; margin-top: 5px; }

        .telemetry #progressStatus {
            font-size: 2rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            font-weight: 900;
        }

        .connection-status { display: flex; align-items: center; gap: 15px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--neon-red); transition: 0.5s; }
        .dot.online { background: var(--neon-green); box-shadow: 0 0 20px var(--neon-green); }

        /* Main Layout */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        /* Radar / Display Section */
        .canvas-section {
            background: #000;
            border: 2px solid #1a1a1a;
            border-radius: 4px;
            position: relative;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }

        #mediaDisplay {
            max-width: 95%;
            max-height: 95%;
            z-index: 5;
            display: none; /* يظهر عند استلام صور أو فيديو */
        }

        canvas { image-rendering: pixelated; position: absolute; z-index: 2; }

        /* Chat Section */
        .chat-section {
            background: var(--panel-bg);
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            height: 550px;
            border-top: 3px solid var(--neon-blue);
        }

        #messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.3);
        }

        .file-log { color: var(--neon-blue); border-left: 2px solid var(--neon-blue); padding-left: 10px; margin: 10px 0; }

        /* Controls */
        .bottom-controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 35px;
            background: #000;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn:hover:not(:disabled) { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px var(--neon-blue); }
        .btn-send { border-color: var(--neon-green); color: var(--neon-green); }
        .btn-send:hover:not(:disabled) { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }

        #fileInput { display: none; }
        .upload-lbl { cursor: pointer; border: 1px solid #fff; padding: 15px 35px; display: inline-block; }

        .scan-line {
            position: absolute; width: 100%; height: 2px;
            background: rgba(0, 242, 255, 0.1); top: 0; left: 0;
            animation: scan 4s linear infinite; z-index: 10; pointer-events: none;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="system-info">
            <h2>QUP UNIFIED CONSOLE v2.0</h2>
            <div id="rotaryCounter">CLOCK: 0000000000</div>
        </div>

        <div class="telemetry">
            <div id="progressStatus">0%</div>
            <div style="font-size: 0.7rem; color: #888;">SYNC RATIO</div>
        </div>

        <div class="connection-status">
            <span id="statusText" style="font-size: 0.8rem;">DISCONNECTED</span>
            <div id="connDot" class="dot"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="canvas-section">
            <div class="scan-line"></div>
            <div id="mediaContainer" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
                <canvas id="matrixCanvas"></canvas>
                <img id="imagePreview" style="max-width:90%; max-height:90%; display:none; border:1px solid var(--neon-blue); shadow: var(--border-glow);">
                <video id="videoPreview" controls style="max-width:90%; max-height:90%; display:none; border:1px solid var(--neon-blue);"></video>
            </div>
        </div>

        <div class="chat-section">
            <div id="messages">
                <div style="color: #555;">> تهيئة بروتوكول الاستقبال... جاري الانتظار.</div>
            </div>
            <div style="padding: 10px; display: flex; gap: 5px; background: #111;">
                <input type="text" id="msgInput" style="flex:1; background:#000; border:1px solid #333; color:white; padding:10px;" placeholder="رسالة نبضية...">
                <button id="sendMsgBtn" class="btn" style="padding:10px 20px;">بث</button>
            </div>
        </div>
    </div>

    <div class="bottom-controls">
        <label for="fileInput" class="upload-lbl">📁 اختيار مصفوفة</label>
        <input type="file" id="fileInput">
        <button id="sendBtn" class="btn btn-send" disabled>إطلاق النبضة الكاملة</button>
        <button id="clearBtn" class="btn" onclick="location.reload()">تصفير الأنظمة</button>
    </div>

    <script type="module">
        import { io } from "https://cdn.socket.io/4.7.4/socket.io.esm.min.js";
        
        // الرابط الجديد للسيرفر المنقح
        const socket = io("https://6cbd87ca-1712-4388-9d90-44f0853ce0ba-00-1e3zq6wdeyv28.worf.replit.dev/", {
            transports: ["websocket"],
            reconnection: true
        });
        
        window.socket = socket;

        socket.on('connect', () => {
            document.getElementById('connDot').classList.add('online');
            document.getElementById('statusText').innerText = 'SECURE LINK ACTIVE';
            logToChat("تم الربط مع السيرفر المركزي بنجاح.");
        });

        // التعامل مع الملفات المرفوعة
        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const fileType = file.type;

            // منطق العرض الجغرافي (تلفاز vs دردشة)
            if (fileType.startsWith('image/')) {
                displayInTV('image', URL.createObjectURL(file));
                logToChat(`تم تحميل صورة: ${file.name} (عرض على الرادار)`);
            } else if (fileType.startsWith('video/')) {
                displayInTV('video', URL.createObjectURL(file));
                logToChat(`تم تحميل فيديو: ${file.name} (عرض على الرادار)`);
            } else {
                displayInTV('none'); // إخفاء الميديا
                logToChat(`<div class="file-log">📦 ملف بيانات مكتشف: ${file.name}<br>الحجم: ${(file.size/1024).toFixed(2)} KB<br>النوع: ${fileType}</div>`);
            }
        });

        function displayInTV(type, src) {
            const img = document.getElementById('imagePreview');
            const video = document.getElementById('videoPreview');
            const canvas = document.getElementById('matrixCanvas');

            img.style.display = 'none';
            video.style.display = 'none';
            canvas.style.opacity = '1';

            if (type === 'image') {
                img.src = src;
                img.style.display = 'block';
                canvas.style.opacity = '0.2';
            } else if (type === 'video') {
                video.src = src;
                video.style.display = 'block';
                video.play();
                canvas.style.opacity = '0.2';
            }
        }

        function logToChat(msg) {
            const msgs = document.getElementById('messages');
            msgs.innerHTML += `<div>> ${msg}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }

        window.updateProgressPulse = (ratio) => {
            document.getElementById('progressStatus').innerText = Math.floor(ratio * 100) + "%";
        };

        window.updateRotaryVisual = (tick, total) => {
            document.getElementById('rotaryCounter').innerText = `CLOCK: ${tick.toString().padStart(10, '0')}`;
        };

        document.getElementById('sendMsgBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            if(input.value && window.injectTextMessage) {
                window.injectTextMessage(input.value);
                logToChat(`<span style="color:var(--neon-green)">أنت:</span> ${input.value}`);
                input.value = "";
            }
        };
    </script>

    <script type="module" src="Zied.js"></script>
</body>
</html>
