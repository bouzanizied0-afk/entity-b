<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Twin DNA Engine v12.0</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .factory-box { border: 2px solid #00ff41; padding: 20px; width: 450px; background: #000; text-align: center; box-shadow: 0 0 30px rgba(0,255,65,0.2); }
        canvas { margin-top: 20px; border: 1px solid #333; max-width: 100%; image-rendering: pixelated; }
        .stats { font-size: 12px; margin-top: 10px; color: #008f11; display: flex; justify-content: space-between; }
        .log { font-size: 11px; background: #080808; padding: 10px; margin-top: 15px; border: 1px solid #111; height: 60px; overflow: hidden; text-align: left; }
    </style>
</head>
<body>

    <div class="factory-box">
        <h3>TWIN_DNA_ASSEMBLER</h3>
        <div class="stats">
            <span>DNA_SEQUENCE: <span id="dna-progress">0</span>%</span>
            <span>STATUS: <span id="status">IDLE</span></span>
        </div>

        <input type="file" id="source" accept="image/*" style="color:#00ff41; font-size: 12px;">
        
        <canvas id="renderTarget"></canvas>

        <div class="log" id="terminal">READY_FOR_DECONSTRUCTION...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
          storageBucket: "zied-e3b78.firebasestorage.app",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const canvas = document.getElementById('renderTarget');
        const ctx = canvas.getContext('2d');

        // --- المستقبل (التوأم): يركب الصورة من "الأرقام" المستلمة ---
        onValue(ref(db, "temporal/stream"), (snap) => {
            const dna = snap.val();
            if (dna && dna.raw) {
                document.getElementById('status').innerText = "ASSEMBLING...";
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    document.getElementById('status').innerText = "COMPLETE";
                };
                // تحويل مصفوفة الأرقام المستلمة إلى مادة بصرية
                img.src = dna.raw;
                document.getElementById('dna-progress').innerText = "100";
            }
        });

        // --- المرسل (المفكك): يحول الصورة إلى "بصمة جينية" رقمية ---
        document.getElementById('source').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "DECONSTRUCTING...";
            const reader = new FileReader();
            
            reader.onload = async (event) => {
                const dataURL = event.target.result;
                
                // هنا نقوم بـ "التفكيك": تحويل المادة إلى بصمة معلوماتية (Base64)
                // في نظام التوأم، هذه البصمة هي "كتالوج التركيب"
                const dnaPackage = {
                    t: Date.now(),
                    l: file.size,
                    raw: dataURL // هذه هي مادة الليغو (الأرقام)
                };

                // إرسال البصمة للخادم
                await set(ref(db, "temporal/stream"), dnaPackage);
                await set(ref(db, "temporal/counter"), Date.now());
                
                document.getElementById('terminal').innerText = `DNA_SENT: ${file.size} BYTES`;
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
