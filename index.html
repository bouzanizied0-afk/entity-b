<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام التزامن التلقائي الفوري</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0a0a0a;
            color: #00d4ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        .container {
            background: #111;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #00d4ff;
            width: 450px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0,212,255,0.2);
        }

        .server-status {
            background: #000;
            padding: 5px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 20px;
            color: #555;
        }

        input[type="file"] {
            margin: 20px 0;
            color: #00d4ff;
        }

        #resultImg {
            display: none;
            margin-top: 20px;
            max-width: 100%;
            border: 2px solid #00d4ff;
            border-radius: 10px;
            animation: fadeIn 0.5s;
        }

        .status {
            margin-top: 15px;
            font-size: 0.9em;
            color: #888;
        }

        .loader {
            display: none;
            margin: 10px auto;
            border: 3px solid #333;
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="server-status">
        قناة المزامنة: <span id="serverTimer">0</span>
    </div>

    <h2>تزامن تلقائي (بث حي)</h2>

    <input type="file" id="fileInput" accept="image/*">

    <div class="loader" id="loader"></div>
    <div id="statusText" class="status">في انتظار بيانات...</div>

    <img id="resultImg" alt="الصورة المستلمة">
</div>

<!-- ربط الواجهة بالمحرّك -->
<script type="module" src="./client.js"></script>

</body>
</html>
