<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار العداد</title>
</head>
<body>

<h2>عداد الخادم:</h2>
<div id="counter">0</div>
<button id="inc">زيادة</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "ضع_API_KEY_هنا",
    authDomain: "zied-e3b78.firebaseapp.com",
    databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "zied-e3b78"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const counterRef = ref(db, "test/counter");

  // استماع مباشر
  onValue(counterRef, (snap) => {
    document.getElementById("counter").innerText = snap.val() ?? 0;
  });

  // زيادة العداد
  document.getElementById("inc").onclick = async () => {
    const snap = await get(counterRef);
    const next = (snap.val() || 0) + 1;
    await set(counterRef, next);
  };
</script>

</body>
</html>
