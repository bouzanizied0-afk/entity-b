<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Universal Moment Translator – Socket.IO</title>
<style>
body { margin:0; font-family: monospace; background:#000; color:#0f0; text-align:center; }
#momentDisplay { font-size:64px; margin:20px; }
#localQueue { margin:20px; max-height:300px; overflow-y:auto; border:1px solid #0f0; padding:10px; text-align:left; }
input, button { font-size:18px; margin:5px; padding:5px; }
canvas { display:block; margin:auto; background:#111; border:1px solid #0f0; }
</style>
</head>
<body>

<h2>⏳ Universal Moment Translator – Local Interface</h2>
<div id="momentDisplay">0</div>

<input id="textInput" placeholder="اكتب حرف أو كلمة">
<button id="addTextBtn">إضافة نص</button>
<button id="addFileBtn">إضافة ملف محلي</button>
<button id="clearBtn">🗑 مسح كل المحتوى المحلي</button>

<div id="localQueue"></div>

<canvas id="canvas" width="256" height="256"></canvas>

<script type="module">
import { UniversalMomentTranslator } from './universal-moment-translator.js';
import { io } from "https://cdn.socket.io/4.7.2/socket.io.esm.min.js";

/* ===============================
   Socket.IO Client – connect to server
=============================== */
const socket = io("http://localhost:3000");

/* ===============================
   Local Buffers
=============================== */
const localQueue = [];
const queueDiv = document.getElementById('localQueue');
function updateQueueDisplay() {
    queueDiv.innerHTML = localQueue.map((item,i)=>`[${i}] ${item.type}: ${item.value}`).join('<br>');
}

/* ===============================
   Canvas & Translator
=============================== */
const canvas = document.getElementById('canvas');
const translator = new UniversalMomentTranslator(canvas, localQueue);

/* ===============================
   Moment Observer
=============================== */
const momentDisplay = document.getElementById('momentDisplay');
socket.on("moment", (moment)=>{
    momentDisplay.textContent = moment;
    translator.onMoment(moment);
});

/* ===============================
   Input Handlers (Local Only)
=============================== */
document.getElementById('addTextBtn').onclick = ()=>{
    const val = document.getElementById('textInput').value.trim();
    if(!val) return;
    localQueue.push({type:'text', value: val});
    updateQueueDisplay();
    document.getElementById('textInput').value = '';
};

document.getElementById('addFileBtn').onclick = ()=>{
    const input = document.createElement('input');
    input.type='file';
    input.onchange = e=>{
        const file = e.target.files[0];
        if(!file) return;
        localQueue.push({type:'file', value:file.name});
        updateQueueDisplay();
    };
    input.click();
};

document.getElementById('clearBtn').onclick = ()=>{
    localQueue.length=0;
    updateQueueDisplay();
};

</script>
</body>
</html>
