<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⏳ عداد متزامن بالخادم</title>
<style>
body {
  background:#000;
  color:#0f0;
  font-family: monospace;
  text-align:center;
  padding-top:50px;
}
#counter {
  font-size:64px;
  margin:20px;
}
</style>
</head>
<body>

<h2>⏳ العداد المتزامن</h2>
<div id="counter">0</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔐 إعداد Firebase (استبدل بالبيانات الخاصة بك إذا لزم)
const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain: "setouchi-it.firebaseapp.com",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "setouchi-it",
  storageBucket: "setouchi-it.appspot.com",
  messagingSenderId: "456612217542",
  appId: "1:456612217542:web:51d963523b1306e0bf4dc7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const counterRef = ref(db, "temporal/counter");

const counterDiv = document.getElementById("counter");

// استقبال القيمة الحالية من الخادم
onValue(counterRef, (snapshot) => {
  const val = snapshot.val();
  if(val !== null) counterDiv.textContent = val;
});

// تحديث العداد في الخادم كل 600 مللي ثانية
setInterval(async () => {
  const current = parseInt(counterDiv.textContent || "0", 10);
  const next = current + 1;
  await set(counterRef, next);
}, 600);

</script>
</body>
</html>
