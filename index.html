<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Twin Factory v9.0 - State Assembly</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .engine-box { border: 1px solid #00ff41; padding: 25px; border-radius: 12px; width: 500px; background: #000; box-shadow: 0 0 30px rgba(0,255,65,0.2); text-align: center; }
        canvas { margin-top: 20px; border: 1px solid #00ff41; background: #000; width: 100%; height: auto; image-rendering: pixelated; }
        .terminal-log { font-size: 13px; color: #00ff41; background: #0a0a0a; padding: 15px; border-radius: 5px; text-align: left; direction: ltr; margin-top: 15px; border: 1px solid #111; }
        .status-bar { font-size: 11px; border-bottom: 1px solid #1a1a1a; margin-bottom: 15px; padding-bottom: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="engine-box">
        <div class="status-bar">
            <span>ASSEMBLY_LINE: ACTIVE</span>
            <span>T: <span id="t-val">0</span></span>
        </div>
        
        <input type="file" id="filePicker" style="color: #00ff41;">
        
        <canvas id="assemblyCanvas"></canvas>

        <div class="terminal-log" id="log">
            READY_FOR_BLUEPRINT...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
          storageBucket: "zied-e3b78.firebasestorage.app",
          messagingSenderId: "774724725374",
          appId: "1:774724725374:web:a338e16e8689d60dd3062f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const PATHS = { counter: "temporal/counter", stream: "temporal/stream" };

        let localT = 0;

        class TwinFactory {
            // تفكيك السيارة إلى "معلومات شحن"
            static async decompose(file, T) {
                const buffer = await file.arrayBuffer();
                const Qlen = buffer.byteLength;
                
                // حسابات حتمية صرفة (الإحداثيات)
                const s = (T * 31 + Qlen * 7) % 255; // استخدام الـ 255 لترميز لوني
                const e = (T * 17 + Qlen * 13) % 255;
                const m = Math.floor((s + e) / 2);

                return { L: Qlen, T: T, S: s, M: m, A: e };
            }

            // إعادة تركيب "السيارة" فورياً عند الطرف الآخر بناءً على المعلومات فقط
            static assemble(data) {
                const canvas = document.getElementById("assemblyCanvas");
                const ctx = canvas.getContext("2d");
                canvas.width = 100;
                canvas.height = 100;

                // بناء كتل لونية (السيارة) بناءً على الإحداثيات المرسلة فقط
                // هنا التوأم "يصنع" صورة متطابقة رياضياً دون أن يرى الأصل
                ctx.fillStyle = `rgb(${data.S}, ${data.M}, ${data.A})`;
                ctx.fillRect(0, 0, 100, 100);
                
                // إضافة نمط حتمي بناءً على الطول L
                ctx.strokeStyle = "#00ff41";
                ctx.strokeRect(data.S % 50, data.M % 50, 40, 40);

                document.getElementById("log").innerHTML = `
                    BLUEPRINT_RECEIVED:<br>
                    - Material_Density: ${data.L}<br>
                    - Color_Vector: ${data.S},${data.M},${data.A}<br>
                    - Assembly_Status: SUCCESSFUL
                `;
            }
        }

        onValue(ref(db, PATHS.counter), async (snap) => {
            const sT = snap.val();
            if (sT && sT > localT) {
                const sSnap = await get(ref(db, `${PATHS.stream}/state_${sT}`));
                const blueprint = sSnap.val();
                if (blueprint) {
                    TwinFactory.assemble(blueprint);
                    localT = sT;
                    document.getElementById("t-val").innerText = sT;
                }
            }
        });

        document.getElementById('filePicker').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const counterSnap = await get(ref(db, PATHS.counter));
            const nextT = (counterSnap.val() || 0) + 1;

            const blueprint = await TwinFactory.decompose(file, nextT);
            
            await set(ref(db, `${PATHS.stream}/state_${nextT}`), blueprint);
            await set(ref(db, PATHS.counter), nextT);
            localT = nextT;
        };
    </script>
</body>
</html>
