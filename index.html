<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام تزامن الصور الحقيقي - البث الآلي</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 30px; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 15px; border: 1px solid #00ff41; width: 450px; text-align: center; box-shadow: 0 0 20px rgba(0,255,65,0.2); }
        .server-status { background: #000; padding: 5px; border-radius: 5px; font-family: monospace; font-size: 12px; margin-bottom: 20px; }
        input[type="file"] { margin: 20px 0; color: #00ff41; }
        #resultImg { display: none; margin-top: 20px; max-width: 100%; border: 1px solid #00ff41; border-radius: 8px; }
        .progress-bar { width: 100%; background: #333; height: 10px; border-radius: 5px; display: none; margin: 10px 0; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #00ff41; transition: 0.3s; }
    </style>
</head>
<body>

    <div class="container">
        <div class="server-status">قناة التزامن النشطة: <span id="serverTimer">0</span></div>
        <h2>تزامن محتوى حتمي (بث آلي)</h2>
        
        <input type="file" id="fileInput" accept="image/*">
        
        <div class="progress-bar" id="progressWrapper">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div id="statusText">في انتظار التزامن...</div>
        
        <img id="resultImg">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
          storageBucket: "zied-e3b78.firebasestorage.app",
          messagingSenderId: "774724725374",
          appId: "1:774724725374:web:a338e16e8689d60dd3062f",
          measurementId: "G-20CPRZJ5JE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const PATHS = {
          heartbeat: "system/heartbeat",
          counter: "temporal/counter",
          stream: "temporal/stream"
        };

        let localT = 0;

        // تحديث نبض النظام
        onValue(ref(db, PATHS.heartbeat), (s) => document.getElementById("serverTimer").innerText = s.val() || 0);

        // الاستماع والتركيب الآلي (Automatic Receiver)
        onValue(ref(db, PATHS.counter), async (snap) => {
            const serverT = snap.val();
            if (serverT && serverT > localT) {
                const stateSnap = await get(ref(db, `${PATHS.stream}/state_${serverT}`));
                const incomingState = stateSnap.val();
                
                if (incomingState) {
                    document.getElementById("statusText").innerText = "جاري عرض الحالة الجديدة آلياً...";
                    
                    // تحويل وتوليد الصورة فوراً دون تدخل بشري
                    const imgElement = document.getElementById("resultImg");
                    imgElement.src = `data:${incomingState.type};base64,${incomingState.data}`;
                    imgElement.style.display = "block";
                    
                    localT = serverT;
                    document.getElementById("statusText").innerText = "تم التزامن: الصورة معروضة الآن.";
                }
            }
        });

        // عملية التفكيك والإرسال (Sender)
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                document.getElementById("progressWrapper").style.display = "block";
                const arrayBuffer = event.target.result;
                const uint8 = new Uint8Array(arrayBuffer);
                
                const base64Data = btoa(String.fromCharCode.apply(null, uint8));

                const counterSnap = await get(ref(db, PATHS.counter));
                const nextT = (counterSnap.val() || 0) + 1;

                const statePayload = {
                    data: base64Data,
                    T: nextT,
                    type: file.type
                };

                await set(ref(db, `${PATHS.stream}/state_${nextT}`), statePayload);
                await set(ref(db, PATHS.counter), nextT);
                
                localT = nextT;
                document.getElementById("statusText").innerText = "تم إرسال التحديث.";
                document.getElementById("progressFill").style.width = "100%";
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
