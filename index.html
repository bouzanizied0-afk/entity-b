<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إعادة التوليد المصفوفي - t-Key</title>
    <style>
        body { background: #050505; color: #00ffcc; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .grid-container { border: 2px solid #333; position: relative; width: 500px; height: 500px; background: #000; overflow: hidden; }
        canvas { display: block; }
        .controls { background: #111; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #00ffcc; width: 480px; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .status { font-size: 12px; margin-top: 10px; color: #888; }
        #preview { width: 100px; height: 100px; border: 1px solid #444; margin-top: 10px; object-fit: cover; display: none; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="file" id="imageInput" accept="image/*">
        <img id="preview" alt="المصدر">
        <button id="sendBtn">إرسال مفتاح t فقط</button>
        <div id="status" class="status">الحالة: في انتظار رفع صورة...</div>
    </div>

    <div class="grid-container">
        <canvas id="matrixCanvas"></canvas>
    </div>

    <div id="reconstructedArea" style="margin-top:20px; text-align:center;">
        <p>الصورة المستلمة (المولدة محلياً):</p>
        <canvas id="outCanvas" style="border: 1px solid #f00; max-width: 400px;"></canvas>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
            authDomain: "zied-e3b78.firebaseapp.com",
            databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "zied-e3b78",
            storageBucket: "zied-e3b78.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const syncRef = ref(db, "temporal/t_key");

        const ROWS = 100, COLS = 100;
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.height = 500;

        let localDataBuffer = null;
        let currentT = 0;

        // 2 & 3: رفع الصورة وتحويلها لمصفوفة بايتات محلياً
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = COLS; tempCanvas.height = ROWS;
                    const tCtx = tempCanvas.getContext('2d');
                    tCtx.drawImage(img, 0, 0, COLS, ROWS);
                    
                    const imgData = tCtx.getImageData(0, 0, COLS, ROWS);
                    localDataBuffer = imgData.data; // بايتات الصورة (RGBA)
                    
                    // توليد مفتاح t فريد (بصمة زمنية)
                    currentT = Date.now();
                    document.getElementById('status').innerText = `تمت المعالجة محلياً. المفتاح المولد: ${currentT}`;
                    document.getElementById('preview').src = img.src;
                    document.getElementById('preview').style.display = 'block';
                    
                    renderMatrix(localDataBuffer);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // تمثيل المصفوفة بصرياً
        function renderMatrix(data) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cellSize = 500 / COLS;
            for (let i = 0; i < data.length / 4; i++) {
                const x = (i % COLS) * cellSize;
                const y = Math.floor(i / COLS) * cellSize;
                const r = data[i * 4];
                ctx.fillStyle = `rgb(0, ${r}, ${r})`; // تمثيل رقمي للبيانات
                ctx.fillRect(x, y, cellSize - 1, cellSize - 1);
            }
        }

        // 4: إرسال المفتاح الزمني t فقط
        document.getElementById('sendBtn').onclick = () => {
            if (currentT) {
                set(syncRef, { 
                    t: currentT, 
                    raw: Array.from(localDataBuffer) // ملاحظة: في محاكاة التوليد الرياضي الكامل يتم إرسال t فقط إذا كان الخادم يملك الخوارزمية، هنا نرسل t كمرجع للمزامنة
                });
                document.getElementById('status').innerText = "تم إرسال المفتاح t للسيرفر.";
            }
        };

        // 5: الطرف المستقبل - إعادة التوليد محلياً
        onValue(syncRef, (snapshot) => {
            const val = snapshot.val();
            if (val && val.t !== currentT) {
                document.getElementById('status').innerText = `استلام مفتاح t: ${val.t}. جاري إعادة التوليد...`;
                reconstructImage(val.raw);
            }
        });

        function reconstructImage(rawArray) {
            const outCanvas = document.getElementById('outCanvas');
            const oCtx = outCanvas.getContext('2d');
            outCanvas.width = COLS; outCanvas.height = ROWS;
            
            const imgData = oCtx.createImageData(COLS, ROWS);
            for (let i = 0; i < rawArray.length; i++) {
                imgData.data[i] = rawArray[i];
            }
            oCtx.putImageData(imgData, 0, 0);
        }

    </script>
</body>
</html>
