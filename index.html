<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المحرك الحتمي - التزامن الرقمي الصرف</title>
    <style>
        body { font-family: monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .engine-box { border: 1px solid #00ff41; padding: 20px; border-radius: 10px; width: 500px; background: #000; box-shadow: 0 0 15px #00ff4133; }
        .status-bar { font-size: 12px; border-bottom: 1px solid #222; margin-bottom: 15px; padding-bottom: 10px; color: #888; }
        #canvas-display { width: 100%; margin-top: 15px; border: 1px solid #333; display: none; }
        .marker-view { font-size: 14px; color: #00ff41; background: #0a0a0a; padding: 15px; margin-top: 10px; border-radius: 5px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="engine-box">
        <div class="status-bar">STATUS: <span id="sync-status">READY</span> | T: <span id="t-val">0</span></div>
        <h3 style="margin:0">Deterministic Engine v3.0 (Pure Coordinates)</h3>
        
        <input type="file" id="source-input" style="margin-top:20px; color:#00ff41;">
        
        <div id="output-zone">
            <div class="marker-view" id="marker-data">
                Qlen: 0<br>
                T: 0<br>
                End: 0<br>
                Mid: 0<br>
                Start: 0
            </div>
            <img id="canvas-display">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
          storageBucket: "zied-e3b78.firebasestorage.app",
          messagingSenderId: "774724725374",
          appId: "1:774724725374:web:a338e16e8689d60dd3062f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const PATHS = { counter: "temporal/counter", stream: "temporal/stream" };

        let localT = 0;

        // --- المحرك المحلي الصارم (Pure Local Engine) ---
        class DeterministicEngine {
            // التفكيك: تحويل الصورة إلى إحداثيات فقط
            static async decompose(file, T) {
                const buffer = await file.arrayBuffer();
                const uint8 = new Uint8Array(buffer);
                const Qlen = uint8.length;
                
                // حساب المؤشرات بناءً على محتوى البايتات (لضمان الارتباط بالمحتوى)
                const sum = uint8.reduce((a, b) => a + b, 0);
                const start = (T * 31 + sum) % Qlen;
                const end = (T * 17 + Qlen) % Qlen;
                const mid = Math.floor((start + end) / 2);

                // ملاحظة: لا نرسل uint8 ولا نرسل Base64، نرسل فقط الخريطة الرقمية
                // ولأغراض العرض التعليمي في هذا الكود، سنخزن "بذرة" (Seed) فقط
                return { Qlen, T, end, mid, start };
            }

            // إعادة التوليد الافتراضي (هذا الجزء يحتاج للمادة الخام محلياً ليعمل)
            static reconstruct(markers) {
                // عرض الأرقام في الواجهة كما تظهر في الخادم
                document.getElementById("marker-data").innerHTML = `
                    Qlen: ${markers.Qlen}<br>
                    T: ${markers.T}<br>
                    End: ${markers.end}<br>
                    Mid: ${markers.mid}<br>
                    Start: ${markers.start}
                `;
            }
        }

        // --- مراقبة الخادم ---
        onValue(ref(db, PATHS.counter), async (snap) => {
            const serverT = snap.val();
            if (serverT && serverT > localT) {
                const stateSnap = await get(ref(db, `${PATHS.stream}/state_${serverT}`));
                const markers = stateSnap.val();
                
                if (markers) {
                    DeterministicEngine.reconstruct(markers);
                    localT = serverT;
                    document.getElementById("t-val").innerText = serverT;
                    document.getElementById("sync-status").innerText = "COORDINATES RECEIVED";
                }
            }
        });

        // --- الإرسال الرقمي الصرف ---
        document.getElementById('source-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const counterSnap = await get(ref(db, PATHS.counter));
            const nextT = (counterSnap.val() || 0) + 1;

            // توليد الأرقام فقط
            const pureMarkers = await DeterministicEngine.decompose(file, nextT);
            
            // إرسال الأرقام فقط للخادم (الآن الخادم أعمى)
            await set(ref(db, `${PATHS.stream}/state_${nextT}`), pureMarkers);
            await set(ref(db, PATHS.counter), nextT);
            
            localT = nextT;
        };
    </script>
</body>
</html>
