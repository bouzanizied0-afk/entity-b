<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>نظام المصفوفة الحية - الربط الاحترافي</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #00ff41; }
        canvas { border: 1px solid #003300; box-shadow: 0 0 15px #00ff41; background: #000; }
        .controls { position: absolute; top: 10px; background: rgba(0, 20, 0, 0.9); padding: 15px; border: 1px solid #00ff41; display: flex; gap: 10px; align-items: center; z-index: 100; }
        button { background: #00ff41; color: #000; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #fff; }
        button:disabled { background: #004400; color: #00ff41; cursor: not-allowed; }
        .info { position: absolute; bottom: 10px; left: 10px; font-size: 12px; }
        #progressContainer { width: 200px; height: 10px; border: 1px solid #00ff41; display: none; background: #000; overflow: hidden; }
        #progressBar { width: 0%; height: 100%; background: #00ff41; transition: width 0.1s; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <button id="deconstructBtn">تفكيك</button>
    <div id="progressContainer"><div id="progressBar"></div></div>
    <button id="sendBtn" disabled>بث عبر الأنبوب</button>
    <button id="masterBtn">وضع التلقائي</button>
</div>

<div class="info">
    الحالة: <span id="status">جاري الاتصال...</span> | العداد: <span id="countDisplay">0</span>
</div>

<canvas id="matrixCanvas"></canvas>

<script type="module">
    // استيراد الدوال من ملفك المنفصل كما هي دون أي تعديل فيه
    import { extractMatrix, compressRow, encryptRow, decompressRow, decryptRow } from './matrixEngine.js';

    // إعداد الأنبوب السريع (نفس الرابط الناجح)
    const SERVER_URL = "https://c7c9c05e-7071-4908-9616-f6be44817257-00-2eyc5vot02n45.worf.replit.dev";
    const socket = io(SERVER_URL, { transports: ["websocket", "polling"] });

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const ROWS = 100; const COLS = 100; const CELL_SIZE = 7;
    canvas.width = COLS * CELL_SIZE; canvas.height = ROWS * CELL_SIZE;

    let liveMatrix = Array.from({length: 100}, () => Array(100).fill(0));
    let localProcessedMatrix = null;
    let globalCounter = 0;
    let isMaster = false;

    // --- استقبال البيانات وفك تشفيرها باستخدام دوال المحرك ---
    socket.on("matrix-relay", (data) => {
        if (data.payload) {
            Object.entries(data.payload).forEach(([y, compressed]) => {
                // استخدام دوال المحرك المستوردة لفك التشفير (Key=7)
                const decrypted = decryptRow(decompressRow(compressed), 7);
                liveMatrix[Number(y)] = decrypted;
            });
            document.getElementById('status').innerText = "تم استلام بث مشفر";
        }
        if (data.counter !== undefined) {
            globalCounter = data.counter;
            document.getElementById('countDisplay').innerText = globalCounter;
        }
    });

    socket.on("connect", () => { document.getElementById('status').innerText = "متصل بالأنبوب"; });

    // --- 1. التفكيك (يستخدم محركك مباشرة) ---
    document.getElementById('deconstructBtn').onclick = async () => {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return alert("اختر صورة أولاً");

        document.getElementById('status').innerText = "جاري التفكيك...";
        document.getElementById('progressContainer').style.display = "block";
        document.getElementById('progressBar').style.width = "50%"; // محاكاة حركية

        const img = new Image();
        img.onload = () => {
            // استخدام دالة المحرك المستوردة
            localProcessedMatrix = extractMatrix(img, 100, 100, 16);
            document.getElementById('progressBar').style.width = "100%";
            
            setTimeout(() => {
                document.getElementById('progressContainer').style.display = "none";
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('status').innerText = "تم التفكيك بنجاح";
                liveMatrix = [...localProcessedMatrix];
            }, 300);
        };
        img.src = URL.createObjectURL(file);
    };

    // --- 2. الإرسال (تجهيز البيانات بنفس منطق المحرك ولكن عبر الأنبوب) ---
    document.getElementById('sendBtn').onclick = () => {
        if (!localProcessedMatrix) return;
        
        const packedData = {};
        localProcessedMatrix.forEach((row, y) => {
            // استخدام دوال المحرك (التشفير والضغط) قبل الإرسال
            const encrypted = encryptRow(row, 7);
            const compressed = compressRow(encrypted);
            packedData[y] = compressed;
        });

        socket.emit("matrix-relay", { payload: packedData, counter: globalCounter });
        document.getElementById('status').innerText = "تم البث بنجاح";
    };

    // وضع التلقائي
    document.getElementById('masterBtn').onclick = () => {
        isMaster = !isMaster;
        document.getElementById('status').innerText = isMaster ? "بث تلقائي نشط" : "توقف البث";
    };

    setInterval(() => {
        if (!isMaster) return;
        globalCounter = (globalCounter % 15) + 1;
        document.getElementById('countDisplay').innerText = globalCounter;
        socket.emit("matrix-relay", { counter: globalCounter });
    }, 300);

    // --- الرسم ---
    function render() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let r = 0; r < ROWS; r++) {
            const row = liveMatrix[r];
            for (let c = 0; c < COLS; c++) {
                const val = row[c];
                const x = c * CELL_SIZE; const y = r * CELL_SIZE;
                if (val === globalCounter && val !== 0) {
                    ctx.fillStyle = "#fff";
                } else {
                    ctx.fillStyle = `rgba(0, 255, 65, ${val / 16 + 0.1})`;
                }
                ctx.fillText(val.toString(16).toUpperCase(), x, y + 6);
            }
        }
        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>
