<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بوابة المصفوفة العالمية - Ultra Dynamic & Tunnel</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #00ff41; }
        canvas { background: #000; image-rendering: pixelated; border: 1px solid #004400; box-shadow: 0 0 20px #00ff41; }
        .controls { position: absolute; top: 10px; background: rgba(0, 10, 0, 0.9); padding: 12px; border: 1px solid #00ff41; display: flex; gap: 12px; z-index: 100; font-size: 13px; align-items: center; flex-wrap: wrap; justify-content: center; }
        button { background: #00ff41; color: #000; border: none; padding: 6px 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #fff; }
        button:disabled { background: #003300; color: #00ff41; }
        input[type="text"] { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 5px; outline: none; width: 180px; }
        #resDisplay { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <button id="deconstructBtn">تفكيك HD</button>
    <button id="sendBtn" disabled>بث عبر البوابة</button>
    
    <div style="border-left: 1px solid #004400; height: 25px; margin: 0 5px;"></div>
    <input type="text" id="urlInput" placeholder="أدخل الرابط (google.com)">
    <button id="tunnelBtn" style="background: #008f11; color: white;">فتح عبر النفق</button>
    
    <span id="resDisplay">الأبعاد: 0x0</span>
</div>

<div id="status" style="position: absolute; bottom: 10px; right: 10px; font-size: 12px;">جاري الاتصال بالأنبوب...</div>

<canvas id="matrixCanvas"></canvas>

<script type="module">
    import { extractMatrix } from './matrixEngine.js';
    import { matrixTunnel } from './matrixTunnel.js'; // استيراد المحرك الجديد

    const SERVER_URL = "https://c7c9c05e-7071-4908-9616-f6be44817257-00-2eyc5vot02n45.worf.replit.dev";
    const socket = io(SERVER_URL, { transports: ["websocket"] });

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let liveMatrix = [];
    let localProcessedMatrix = null;
    let ROWS = 0, COLS = 0;
    let CELL_SIZE = 2;

    socket.on("connect", () => {
        document.getElementById('status').innerText = "✅ متصل بالبوابة السريعة";
    });

    // --- استقبال بيانات المصفوفة (سواء صورة أو نفق) ---
    socket.on("matrix-relay", (data) => {
        if (data.matrix) {
            updateCanvasDimensions(data.matrix);
            liveMatrix = data.matrix;
            if (data.fromTunnel) {
                document.getElementById('status').innerText = "✅ تم جلب البيانات عبر النفق";
            }
        }
    });

    // دالة لتحديث أبعاد الكانفاس تلقائياً
    function updateCanvasDimensions(matrix) {
        const newRows = matrix.length;
        const newCols = matrix[0].length;
        if (newRows !== ROWS || newCols !== COLS) {
            ROWS = newRows;
            COLS = newCols;
            canvas.width = COLS * CELL_SIZE;
            canvas.height = ROWS * CELL_SIZE;
            document.getElementById('resDisplay').innerText = `الأبعاد: ${COLS}x${ROWS}`;
        }
    }

    // --- التحكم في النفق (Tunnel Control) ---
    document.getElementById('tunnelBtn').onclick = () => {
        const url = document.getElementById('urlInput').value;
        if (url) {
            matrixTunnel.sendThroughTunnel(socket, url); // إرسال الطلب المهرب
            document.getElementById('status').innerText = "📡 جاري تهريب الطلب إلى أمريكا...";
        } else {
            alert("يرجى إدخال رابط أولاً");
        }
    };

    // --- عملية التفكيك الأصلية ---
    document.getElementById('deconstructBtn').onclick = async () => {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return alert("اختر صورة أولاً");

        const img = new Image();
        img.onload = () => {
            const QUALITY = 250; 
            localProcessedMatrix = extractMatrix(img, QUALITY, QUALITY, 16);
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('status').innerText = "تم التفكيك - جاهز للبث";
            updateCanvasDimensions(localProcessedMatrix);
            liveMatrix = [...localProcessedMatrix];
        };
        img.src = URL.createObjectURL(file);
    };

    document.getElementById('sendBtn').onclick = () => {
        if (localProcessedMatrix) {
            socket.emit("matrix-relay", { matrix: localProcessedMatrix });
            document.getElementById('status').innerText = "يتم البث الآن...";
        }
    };

    function render() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (liveMatrix.length > 0) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const val = liveMatrix[r][c];
                    if (val > 0) {
                        ctx.fillStyle = `rgb(0, ${val * 16}, 65)`;
                        ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }
        }
        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>
