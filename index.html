<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بوابة المصفوفة العالمية - Full HD Ready</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: monospace; color: #00ff41; }
        canvas { background: #000; image-rendering: pixelated; } /* للحفاظ على حدة الصورة عند التكبير */
        .controls { position: absolute; top: 10px; background: rgba(0, 10, 0, 0.85); padding: 10px; border: 1px solid #00ff41; display: flex; gap: 10px; z-index: 100; font-size: 12px; }
        button { background: #00ff41; color: #000; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold; }
        .info { position: absolute; bottom: 10px; left: 10px; font-size: 11px; background: rgba(0,0,0,0.7); }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="imageInput" accept="image/*">
    <button id="deconstructBtn">تفكيك (HD)</button>
    <button id="sendBtn" disabled>بث البوابة</button>
    <span id="resDisplay">الدقة: 0x0</span>
</div>

<div class="info">
    الحالة: <span id="status">جاري الاتصال...</span> | العداد: <span id="countDisplay">0</span>
</div>

<canvas id="matrixCanvas"></canvas>

<script type="module">
    import { extractMatrix } from './matrixEngine.js';

    const SERVER_URL = "https://c7c9c05e-7071-4908-9616-f6be44817257-00-2eyc5vot02n45.worf.replit.dev";
    const socket = io(SERVER_URL, { transports: ["websocket"] });

    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let liveMatrix = [];
    let localProcessedMatrix = null;
    let ROWS = 0; let COLS = 0;
    let CELL_SIZE = 2; // حجم أصغر للدقة العالية

    socket.on("connect", () => {
        document.getElementById('status').innerText = "✅ متصل بالبوابة";
    });

    // --- الاستقبال الذكي المرن ---
    socket.on("matrix-relay", (data) => {
        if (data.matrix) {
            // إذا تغيرت أبعاد البيانات القادمة، نغير حجم المسرح فوراً
            if (data.matrix.length !== ROWS || data.matrix[0].length !== COLS) {
                ROWS = data.matrix.length;
                COLS = data.matrix[0].length;
                canvas.width = COLS * CELL_SIZE;
                canvas.height = ROWS * CELL_SIZE;
                document.getElementById('resDisplay').innerText = `الدقة: ${COLS}x${ROWS}`;
            }
            liveMatrix = data.matrix;
        }
        if (data.counter !== undefined) {
            document.getElementById('countDisplay').innerText = data.counter;
        }
    });

    document.getElementById('deconstructBtn').onclick = async () => {
        const file = document.getElementById('imageInput').files[0];
        if (!file) return;

        const img = new Image();
        img.onload = () => {
            // هنا نحدد الدقة: يمكنك رفع الـ 100 إلى 500 أو أكثر للتجربة
            // لكن لنبدأ بـ 200 لتجربة سلاسة "المعدات البسيطة"
            const TARGET_RES = 200; 
            localProcessedMatrix = extractMatrix(img, TARGET_RES, TARGET_RES, 16);
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('status').innerText = "تم التفكيك بدقة عالية";
            liveMatrix = [...localProcessedMatrix];
        };
        img.src = URL.createObjectURL(file);
    };

    document.getElementById('sendBtn').onclick = () => {
        if (localProcessedMatrix) {
            socket.emit("matrix-relay", { matrix: localProcessedMatrix });
        }
    };

    function render() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (liveMatrix.length > 0) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const val = liveMatrix[r][c];
                    if (val > 0) {
                        ctx.fillStyle = `rgba(0, 255, 65, ${val / 16})`;
                        ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }
        }
        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>
