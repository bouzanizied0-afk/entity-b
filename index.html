<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>النظام التوأمي - النسخة المستقرة</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .engine-box { border: 1px solid #00ff41; padding: 25px; border-radius: 12px; width: 520px; background: #000; box-shadow: 0 0 25px rgba(0,255,65,0.15); text-align: center; }
        .status-bar { font-size: 11px; border-bottom: 1px solid #1a1a1a; margin-bottom: 20px; padding-bottom: 10px; color: #008f11; display: flex; justify-content: space-between; }
        #resultImg { width: 100%; margin-top: 20px; border: 1px solid #00ff41; border-radius: 8px; display: none; }
        .terminal-log { font-size: 13px; color: #00ff41; background: #0a0a0a; padding: 15px; border-radius: 5px; text-align: left; direction: ltr; margin-top: 15px; border: 1px solid #111; }
        .controls { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; width: 100%; }
        input[type="file"] { color: #00ff41; background: #0a0a0a; padding: 10px; border: 1px dashed #333; border-radius: 5px; cursor: pointer; }
        .delete-btn { background: #ff4b2b; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .delete-btn:hover { background: #ff0000; box-shadow: 0 0 15px #ff000066; }
    </style>
</head>
<body>

    <div class="engine-box">
        <div class="status-bar">
            <span>CORE: ACTIVE</span>
            <span>T: <span id="t-val">0</span></span>
            <span>SYNC: <span id="sync-status">IDLE</span></span>
        </div>
        
        <h2 style="margin:0 0 20px 0;">TWIN SYNC v5.1</h2>
        
        <div class="controls">
            <input type="file" id="filePicker" accept="image/*">
            <button id="globalDelete" class="delete-btn">تنظيف البث (RESET STREAM)</button>
        </div>
        
        <div class="terminal-log" id="log">
            SYSTEM_READY...<br>
            AWAITING_STATE...
        </div>

        <img id="resultImg">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, get, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
          storageBucket: "zied-e3b78.firebasestorage.app",
          messagingSenderId: "774724725374",
          appId: "1:774724725374:web:a338e16e8689d60dd3062f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const PATHS = { counter: "temporal/counter", stream: "temporal/stream" };

        let localT = 0;

        class TwinEngine {
            static async decompose(file, T) {
                const buffer = await file.arrayBuffer();
                const uint8 = new Uint8Array(buffer);
                const Qlen = uint8.length;
                const start = (T * 31 + Qlen * 7) % Qlen;
                const end = (T * 17 + Qlen * 13) % Qlen;
                const mid = Math.floor((start + end) / 2);
                const rawData = btoa(String.fromCharCode.apply(null, uint8));
                return { Qlen, T, Start: start, Mid: mid, And: end, data: rawData, type: file.type };
            }

            static reconstruct(markers) {
                const img = document.getElementById("resultImg");
                img.src = `data:${markers.type};base64,${markers.data}`;
                img.style.display = "block";
                document.getElementById("log").innerHTML = `Qlen: ${markers.Qlen}<br>Start: ${markers.Start}<br>Mid: ${markers.Mid}<br>And: ${markers.And}<br>T: ${markers.T}`;
            }
        }

        onValue(ref(db, PATHS.counter), async (snap) => {
            const serverT = snap.val();
            if (serverT && serverT > 0) {
                if (serverT > localT) {
                    const stateSnap = await get(ref(db, `${PATHS.stream}/state_${serverT}`));
                    const markers = stateSnap.val();
                    if (markers) {
                        TwinEngine.reconstruct(markers);
                        localT = serverT;
                        document.getElementById("t-val").innerText = serverT;
                        document.getElementById("sync-status").innerText = "LIVE";
                    }
                }
            } else {
                clearUI();
            }
        });

        document.getElementById('filePicker').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const counterSnap = await get(ref(db, PATHS.counter));
            const nextT = (counterSnap.val() || 0) + 1;
            const state = await TwinEngine.decompose(file, nextT);
            await set(ref(db, `${PATHS.stream}/state_${nextT}`), state);
            await set(ref(db, PATHS.counter), nextT);
            localT = nextT;
        };

        // حذف ذكي: يصفر العداد ويمسح البيانات دون حذف المسار الرئيسي
        document.getElementById('globalDelete').onclick = async () => {
            if(confirm("تنظيف البث الحالي؟")) {
                await set(ref(db, PATHS.counter), 0);
                await remove(ref(db, PATHS.stream));
                clearUI();
                document.getElementById("log").innerText = "STREAM_RESET_SUCCESS.";
            }
        };

        function clearUI() {
            document.getElementById("resultImg").style.display = "none";
            document.getElementById("resultImg").src = "";
            document.getElementById("t-val").innerText = "0";
            document.getElementById("sync-status").innerText = "IDLE";
            localT = 0;
        }
    </script>
</body>
</html>
