<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Stream v6.0 | Atomic Chunks</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fflate/0.8.0/browser.js"></script>
    <style>
        :root { --neon: #00e5ff; --danger: #ff4444; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .engine-card { background: #111; border: 2px solid var(--neon); padding: 25px; border-radius: 15px; width: 100%; max-width: 500px; }
        .status-box { background: #000; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 13px; border-right: 4px solid var(--neon); }
        .bar-container { background: #222; height: 12px; border-radius: 6px; margin: 10px 0; position: relative; overflow: hidden; }
        .bar { height: 100%; background: var(--neon); width: 0%; transition: 0.2s; shadow: 0 0 10px var(--neon); }
        .log-stream { height: 100px; overflow-y: auto; font-size: 11px; color: #666; background: #000; padding: 5px; }
        .btn { background: var(--neon); color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }
        /* العداد الجديد */
        .heartbeat-monitor { margin-bottom: 15px; font-size: 18px; color: #ffca28; border: 1px dashed #ffca28; padding: 5px 20px; border-radius: 50px; }
    </style>
</head>
<body>

<div class="heartbeat-monitor">نبض الخادم العابر: <span id="globalCounter">0</span></div>

<div class="engine-card">
    <h3 style="text-align: center; color: var(--neon);">نظام البث الذري v6.0</h3>
    
    <input type="file" id="fileInput">
    
    <div class="status-box">
        <div>إرسال (تونس): <span id="sendProgress">0%</span></div>
        <div class="bar-container"><div class="bar" id="sendBar"></div></div>
        
        <div style="margin-top: 15px;">استقبال (أمريكا): <span id="recvProgress">0%</span></div>
        <div class="bar-container"><div class="bar" id="recvBar" style="background: #ffca28;"></div></div>
    </div>

    <div class="log-stream" id="log">بانتظار الإشارة...</div>
    <button id="finalBtn" class="btn" style="display:none; margin-top:10px;">تجسيد الملف المكتمل</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
        authDomain: "zied-e3b78.firebaseapp.com",
        databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "zied-e3b78"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const CHUNK_SIZE = 1024 * 512; 
    let sessionID = Math.random().toString(36).substring(7);

    // --- وظيفة العداد العالمي (الاختبار) ---
    const counterRef = ref(db, 'system/globalTimer');
    
    // 1. الاستماع للعداد (للمتصفحين)
    onValue(counterRef, (snapshot) => {
        const val = snapshot.val() || 0;
        document.getElementById('globalCounter').innerText = val;
    });

    // 2. تحديث العداد (متصفح واحد فقط يقوم بالمهمة لرفع الرقم)
    setInterval(async () => {
        const snap = await get(counterRef);
        let current = snap.val() || 0;
        let next = current >= 10 ? 1 : current + 1;
        set(counterRef, next);
    }, 2000); // تحديث كل ثانيتين

    function updateBar(id, percent) {
        document.getElementById(id + 'Bar').style.width = percent + '%';
        document.getElementById(id + 'Progress').innerText = Math.round(percent) + '%';
    }

    // --- الإرسال (تونس) ---
    document.getElementById('fileInput').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
        document.getElementById('log').innerText = `تم تقسيم الملف إلى ${totalChunks} قطعة جينية.`;

        for (let i = 0; i < totalChunks; i++) {
            const start = i * CHUNK_SIZE;
            const end = Math.min(file.size, start + CHUNK_SIZE);
            const chunk = file.slice(start, end);
            
            const buffer = await chunk.arrayBuffer();
            const compressed = fflate.zlibSync(new Uint8Array(buffer));
            const base64 = btoa(String.fromCharCode.apply(null, compressed));

            await set(ref(db, `stream/chunk`), {
                data: base64,
                index: i,
                total: totalChunks,
                name: file.name,
                type: file.type,
                sender: sessionID,
                t: Date.now()
            });

            updateBar('send', ((i + 1) / totalChunks) * 100);
        }
    };

    // --- الاستقبال (تونس/متصفح 2) ---
    let assembly = [];
    let lastIndex = -1;

    onValue(ref(db, `stream/chunk`), async (snap) => {
        const val = snap.val();
        if (!val || val.sender === sessionID || val.index === lastIndex) return;

        lastIndex = val.index;
        const raw = Uint8Array.from(atob(val.data), c => c.charCodeAt(0));
        const decompressed = fflate.unzlibSync(raw);
        
        assembly[val.index] = decompressed;
        updateBar('recv', ((val.index + 1) / val.total) * 100);

        await remove(ref(db, `stream/chunk`));

        if (assembly.filter(x => x).length === val.total) {
            document.getElementById('log').innerText = "تم اكتمال التجسيد الذري!";
            const btn = document.getElementById('finalBtn');
            btn.style.display = "block";
            btn.onclick = () => {
                const blob = new Blob(assembly, { type: val.type });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "RECONSTRUCTED_" + val.name;
                a.click();
            };
        }
    });
</script>
</body>
</html>
