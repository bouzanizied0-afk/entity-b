<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إختبار الأنبوب السريع</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #000; color: #00ff41; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        #counter { font-size: 100px; margin: 20px; text-shadow: 0 0 20px #00ff41; }
        button { padding: 20px 40px; font-size: 20px; background: #00ff41; border: none; cursor: pointer; font-weight: bold; }
        .status { margin-bottom: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="status" id="status">جاري الاتصال بالخادم...</div>
    <div id="counter">0</div>
    <button id="addBtn">إضافة +1</button>

    <script>
        // رابط خادمك في Replit
        const SERVER_URL = "https://c7c9c05e-7071-4908-9616-f6be44817257-00-2eyc5vot02n45.worf.replit.dev/";
        
        const socket = io(SERVER_URL, { transports: ["websocket"] });
        let count = 0;

        const statusDiv = document.getElementById('status');
        const counterDiv = document.getElementById('counter');
        const addBtn = document.getElementById('addBtn');

        // عند الاتصال
        socket.on("connect", () => {
            statusDiv.innerText = "✅ متصل بالخادم: " + socket.id;
            statusDiv.style.color = "#00ff41";
        });

        // عند استقبال "نبضة" من الأنبوب
        socket.on("matrix-relay", (data) => {
            if(data.testCounter !== undefined) {
                count = data.testCounter;
                counterDiv.innerText = count;
                console.log("استلمت تحديث من جهاز آخر:", count);
            }
        });

        // عند الضغط على الزر (إرسال للجميع)
        addBtn.onclick = () => {
            count++;
            counterDiv.innerText = count;
            // نرسل القيمة الجديدة عبر الأنبوب
            socket.emit("matrix-relay", { testCounter: count });
        };

        socket.on("connect_error", (err) => {
            statusDiv.innerText = "❌ فشل الاتصال: تأكد أن Replit يعمل (Run)";
            statusDiv.style.color = "red";
        });
    </script>
</body>
</html>
