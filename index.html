<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⏳ Blind Temporal Counter</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; text-align:center; padding-top:20px; }
#counter { font-size:64px; margin:20px; }
input, button { font-size:18px; padding:8px; margin:5px; }
</style>
</head>
<body>

<h2>⏳ العداد المتزامن الأعمى</h2>
<div id="counter">0</div>

<input id="momentInput" placeholder="اكتب أي شيء">
<button id="sendBtn">إرسال</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "setouchi-it"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const counterRef = ref(db, "temporal/counter");
const momentRef  = ref(db, "temporal/moment");

const counterDiv = document.getElementById("counter");

// تزامن العداد
onValue(counterRef, s => {
  if (s.exists()) counterDiv.textContent = s.val();
});

// نبض العداد
setInterval(() => {
  const v = parseInt(counterDiv.textContent || "0", 10);
  set(counterRef, v + 1);
}, 600);

// إرسال لحظة فقط (لا محتوى)
document.getElementById("sendBtn").onclick = () => {
  const raw = document.getElementById("momentInput").value;
  const moment = Date.now() ^ raw.length; // اختزال → رقم فقط
  set(momentRef, moment);
};
</script>
</body>
</html>
