<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصفوفة التزامن الدوري 100x100</title>
    <style>
        body { margin: 0; background: #050505; color: #00ffcc; font-family: monospace; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 1px solid #333; }
        .info { position: absolute; top: 10px; left: 10px; font-size: 12px; color: #555; }
    </style>
</head>
<body>
    <div class="info">نظام المصفوفة: 100×100 | التزامن: فعال</div>
    <canvas id="matrixCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات الخادم (نفس المسارات التي زودتني بها)
        const firebaseConfig = {
            apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
            authDomain: "zied-e3b78.firebaseapp.com",
            databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "zied-e3b78",
            storageBucket: "zied-e3b78.firebasestorage.app",
            messagingSenderId: "774724725374",
            appId: "1:774724725374:web:a338e16e8689d60dd3062f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const matrixRef = ref(db, "sync/matrix_state");

        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        // إعدادات المصفوفة (قابلة للتوسع بسهولة)
        const ROWS = 100;
        const COLS = 100;
        const CELL_SIZE = 8; 
        canvas.width = COLS * CELL_SIZE;
        canvas.height = ROWS * CELL_SIZE;

        let timeFactor = 0; 
        let isMaster = false;

        // 1. تحديد من هو "المنسق" للحركة (أول متصل أو تحديث دوري)
        // ملاحظة: لتحقيق مزامنة كاملة، نعتمد على "إشارة الوقت" من الخادم
        onValue(matrixRef, (snapshot) => {
            const data = snapshot.val();
            if (data && !isMaster) {
                timeFactor = data.t; // استقبال إشارة الحركة من المتصفح النشط الآخر
            }
        });

        // دالة الحركة الدورية (Mathematical Pattern)
        function getNumber(r, c, t) {
            // دالة جيبية تعتمد على الموقع والزمن لتوليد رقم بين 0-9
            const val = Math.sin(r * 0.1 + c * 0.1 + t) * 5 + 5;
            return Math.floor(val);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "6px monospace";
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const num = getNumber(r, c, timeFactor);
                    const x = c * CELL_SIZE;
                    const y = r * CELL_SIZE;
                    
                    // تغيير السطوع بناءً على الرقم لتعزيز الرؤية
                    ctx.fillStyle = `rgba(0, 255, 204, ${num / 10 + 0.2})`;
                    ctx.fillText(num, x, y + 6);
                }
            }

            // تحديث محلي للحركة
            timeFactor += 0.05;

            // 5. إرسال إشارة الحركة فقط (التغير الرقمي الزمني) كل 10 إطارات لتقليل ضغط الشبكة
            if (Math.floor(timeFactor * 10) % 10 === 0) {
                set(matrixRef, { t: timeFactor });
            }

            requestAnimationFrame(draw);
        }

        // تشغيل النظام
        draw();

        // لجعل المتصفح الحالي هو المصدر عند التفاعل (اختياري لضمان السيطرة)
        window.onclick = () => isMaster = true;

    </script>
</body>
</html>
