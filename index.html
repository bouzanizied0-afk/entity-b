<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Twin Factory v11.0 - Real Assembly</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff41; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .factory-floor { border: 2px solid #00ff41; padding: 20px; width: 500px; background: #000; box-shadow: 0 0 40px rgba(0,255,65,0.2); text-align: center; }
        /* حاوية التجميع */
        #assemblyArea { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 1px; 
            margin-top: 20px; 
            width: 400px; height: 400px;
            margin-left: auto; margin-right: auto;
            border: 1px solid #1a1a1a;
        }
        .chunk { width: 40px; height: 40px; background: #050505; border: 0.1px solid #111; background-size: 400px 400px; }
        .status-panel { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 10px; border-bottom: 1px solid #00ff41; }
    </style>
</head>
<body>

    <div class="factory-floor">
        <div class="status-panel">
            <span>UNIT_ASSEMBLY: ACTIVE</span>
            <span>PARTS: <span id="parts-count">0</span>/100</span>
        </div>

        <input type="file" id="filePicker" accept="image/*" style="color:#00ff41;">
        
        <div id="assemblyArea">
            </div>

        <div id="log" style="font-size:12px; margin-top:15px; color:#008f11;">AWAITING_CHUNKS...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC_oqjbxC27qLhH6mx_ngg4WCZUrMW2B7U",
          authDomain: "zied-e3b78.firebaseapp.com",
          databaseURL: "https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zied-e3b78",
          storageBucket: "zied-e3b78.firebasestorage.app",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const assemblyArea = document.getElementById('assemblyArea');
        const chunksCount = 100; // سنقسم الصورة لـ 100 قطعة

        // توليد مربعات التجميع مسبقاً
        for(let i=0; i<chunksCount; i++) {
            const div = document.createElement('div');
            div.className = 'chunk';
            div.id = `chunk-${i}`;
            assemblyArea.appendChild(div);
        }

        // --- المستقبل (التوأم): يستلم القطعة ويضعها في مكانها فورا ---
        onValue(ref(db, "temporal/stream"), (snap) => {
            const data = snap.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    const part = data[key];
                    const slot = document.getElementById(`chunk-${part.id}`);
                    if (slot && !slot.style.backgroundImage) {
                        // وضع المادة (الصورة) في المربع المخصص لها
                        slot.style.backgroundImage = `url(${part.img})`;
                        // ضبط الإزاحة لتظهر الصورة بشكل صحيح (مثل البازل)
                        const x = (part.id % 10) * 40;
                        const y = Math.floor(part.id / 10) * 40;
                        slot.style.backgroundPosition = `-${x}px -${y}px`;
                        slot.style.border = "none";
                    }
                });
                document.getElementById('parts-count').innerText = Object.keys(data).length;
            }
        });

        // --- المرسل (المفكك): يقطع الصورة ويرسل كل قطعة على حدة ---
        document.getElementById('filePicker').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            await remove(ref(db, "temporal/stream")); // تنظيف البث القديم
            
            const reader = new FileReader();
            reader.onload = async (event) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 400; canvas.height = 400;
                    ctx.drawImage(img, 0, 0, 400, 400);

                    for (let i = 0; i < chunksCount; i++) {
                        // قص قطعة صغيرة (40x40)
                        const partCanvas = document.createElement('canvas');
                        partCanvas.width = 40; partCanvas.height = 40;
                        const px = (i % 10) * 40;
                        const py = Math.floor(i / 10) * 40;
                        partCanvas.getContext('2d').putImageData(ctx.getImageData(px, py, 40, 40), 0, 0);
                        
                        const partData = {
                            id: i,
                            img: partCanvas.toDataURL("image/webp", 0.5) // إرسال المادة مضغوطة جداً
                        };

                        // شحن القطعة للخادم
                        set(ref(db, `temporal/stream/p_${i}`), partData);
                        await new Promise(r => setTimeout(r, 100)); // سرعة "عمال" التركيب
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
