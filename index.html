<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⏳ Temporal Chat + Full Media</title>
<style>
body {
  background:#000;
  color:#0f0;
  font-family: monospace;
  text-align:center;
  padding-top:20px;
}
#minute {
  font-size:64px;
  margin:20px;
}
#chat {
  font-size:28px;
  color:#ff0;
  margin:20px auto;
  width:80%;
  max-height:400px;
  overflow-y:auto;
  text-align:left;
}
input[type=text] {
  width:50%;
  font-size:18px;
  padding:8px;
}
button {
  font-size:16px;
  padding:8px 16px;
  margin:5px;
  background:#003300;
  color:#0f0;
  border:1px solid #0f0;
}
img, video {
  max-width: 80%;
  margin:5px 0;
  display:block;
}

#longCounter {
  font-size:32px;
  margin:10px auto;
  color:#0ff;
  font-family: monospace;
  letter-spacing: 2px;
  }

</style>
</head>
<body>

<h2>⏳ دردشة بوابة الزمن مع وسائط كاملة</h2>
 
 <div id="minute">1</div>
<div id="longCounter">000000000000000000000000000000</div>
<div id="chat"></div>

<input id="messageInput" placeholder="اكتب رسالتك هنا">
<button onclick="sendMessage()">إرسال نص</button>
<button onclick="sendFile()">إرسال ملف</button>
<button id="clearBtn">🗑 حذف كل الرسائل والملفات</button>

<script type="module">
// ===== استيرادات =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { initTranslator } from "./simple-translator.js";

// ===== إعداد Firebase =====
const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain: "setouchi-it.firebaseapp.com",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "setouchi-it",
  storageBucket: "setouchi-it.appspot.com",
  messagingSenderId: "456612217542",
  appId: "1:456612217542:web:51d963523b1306e0bf4dc7"
};

// ===== تهيئة التطبيق وقاعدة البيانات =====
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== تفعيل المترجم مرة واحدة فقط =====
initTranslator(db);

// ===== إعداد المراجع =====
const chatRef = ref(db, "temporal/chat");
const filesRef = ref(db, "temporal/files");

// ===== IndexedDB للتخزين المحلي =====
let dbIndexed;
const request = indexedDB.open("TemporalChatDB",1);
request.onupgradeneeded = e => {
  dbIndexed = e.target.result;
  if(!dbIndexed.objectStoreNames.contains("messages")){
    dbIndexed.createObjectStore("messages",{keyPath:"nano"});
  }
  if(!dbIndexed.objectStoreNames.contains("files")){
    dbIndexed.createObjectStore("files",{keyPath:"nano"});
  }
};
request.onsuccess = e => {
  dbIndexed = e.target.result;
  displayMessages();
};

// ===== العداد الدوري 1→10 =====
let tick = 1;
const minuteDiv = document.getElementById("minute");
const queue = [];
const fileQueue = [];

setInterval(()=>{
  tick++;
  if(tick>10) tick=1;
  minuteDiv.textContent = tick;

  // إرسال نصوص
  if(queue.length>0){
    const msg = queue.shift();
    const nano = Date.now();
    push(chatRef,{type:'text',text:msg,nano});
    storeMessageLocal({type:'text',text:msg,nano});
  }

  // إرسال ملفات
  if(fileQueue.length>0){
    const item = fileQueue.shift();
    const reader = new FileReader();
    reader.onload = e=>{
      push(filesRef,{
        fileName:item.fileName,
        type:item.type,
        chunk:e.target.result,
        nano:Date.now()
      });
      storeFileLocal({
        fileName:item.fileName,
        type:item.type,
        chunk:e.target.result,
        nano:Date.now()
      });
    };
    reader.readAsArrayBuffer(item.chunk);
  }

},600);

// ===== إرسال نص =====
window.sendMessage = ()=>{
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if(!text) return;
  queue.push(text);
  input.value="";
};

// ===== إرسال ملف =====
window.sendFile = ()=>{
  const input = document.createElement("input");
  input.type="file";
  input.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const chunkSize = 5*1024*1024; // تقسيم داخلي (5 ميغا)
    let offset = 0;
    while(offset<file.size){
      const slice = file.slice(offset,offset+chunkSize);
      fileQueue.push({chunk:slice,fileName:file.name,type:file.type});
      offset+=chunkSize;
    }
  };
  input.click();
};

// ===== استقبال الرسائل من الخادم =====
onValue(chatRef,snap=>{displayMessages();});
onValue(filesRef,snap=>{displayMessages();});

// ===== عرض الرسائل والملفات =====
function displayMessages(){
  const chat = document.getElementById("chat");
  chat.innerHTML="";
  if(!dbIndexed) return;

  const tx=dbIndexed.transaction("messages","readonly");
  const store=tx.objectStore("messages");
  store.openCursor().onsuccess=e=>{
    const cursor=e.target.result;
    if(cursor){
      const div=document.createElement("div");
      div.textContent=cursor.value.text;
      chat.appendChild(div);
      cursor.continue();
    }
  };

  const ftx=dbIndexed.transaction("files","readonly");
  const fstore=ftx.objectStore("files");
  fstore.openCursor().onsuccess=e=>{
    const cursor=e.target.result;
    if(cursor){
      const div=document.createElement("div");
      if(cursor.value.type.startsWith("image/")){
        const img=document.createElement("img");
        img.src=URL.createObjectURL(new Blob([cursor.value.chunk]));
        div.appendChild(img);
      } else if(cursor.value.type.startsWith("video/")){
        const vid=document.createElement("video");
        vid.src=URL.createObjectURL(new Blob([cursor.value.chunk]));
        vid.controls=true;
        div.appendChild(vid);
      } else {
        div.textContent=`[ملف] ${cursor.value.fileName}`;
      }
      chat.appendChild(div);
      cursor.continue();
    }
  };
}

// ===== التخزين المحلي =====
function storeMessageLocal(msg){
  if(!dbIndexed) return;
  const tx=dbIndexed.transaction("messages","readwrite");
  tx.objectStore("messages").put(msg);
}

function storeFileLocal(file){
  if(!dbIndexed) return;
  const tx=dbIndexed.transaction("files","readwrite");
  tx.objectStore("files").put(file);
}

// ===== مسح الرسائل والملفات =====
document.getElementById("clearBtn").addEventListener("click", ()=> {
  if(!dbIndexed) return;
  
  const txMsg = dbIndexed.transaction("messages","readwrite");
  txMsg.objectStore("messages").clear();

  const txFiles = dbIndexed.transaction("files","readwrite");
  txFiles.objectStore("files").clear();

  document.getElementById("chat").innerHTML = "";
});
const longCounterDiv = document.getElementById("longCounter");
let longCounter = Array.from({length:30},()=>Math.floor(Math.random()*10));

setInterval(()=>{
  longCounter = longCounter.map(()=>Math.floor(Math.random()*10));
  longCounterDiv.textContent = longCounter.join("");

  set(ref(db, "temporal/longCounter"), {
    value: longCounter.join(""),
    nano: Date.now()
  });
}, 100);

</script>

</body>
</html>
