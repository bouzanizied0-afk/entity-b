<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نموذج توليد الصور بالـ t-Chunks</title>
<style>
body { background:#000; color:#0ff; font-family: monospace; display:flex; flex-direction:column; align-items:center; padding:20px; }
canvas { border:1px solid #333; margin-top:20px; }
button { margin-top:10px; padding:10px; background:#0ff; color:#000; border:none; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>
<h2>نموذج توليد الصور عبر t-Chunks</h2>
<input type="file" id="imageInput" accept="image/*">
<button id="sendBtn">إرسال المفاتيح t فقط</button>
<canvas id="previewCanvas" width="300" height="300"></canvas>
<canvas id="reconstructCanvas" width="300" height="300"></canvas>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';// إعداد Firebase const firebaseConfig = { databaseURL: 'https://zied-e3b78-default-rtdb.europe-west1.firebasedatabase.app', projectId: 'zied-e3b78' }; const app = initializeApp(firebaseConfig); const db = getDatabase(app); const streamRef = ref(db, 't_chunks/stream');

const previewCanvas = document.getElementById('previewCanvas'); const previewCtx = previewCanvas.getContext('2d'); const reconstructCanvas = document.getElementById('reconstructCanvas'); const reconstructCtx = reconstructCanvas.getContext('2d');

const CHUNK_SIZE = 50; // حجم كل chunk 50x50 let chunks = [];

// دالة توليد بايتات chunk من seed t function* proceduralChunk(seed, length) { let x = seed; for (let i=0; i<length; i++) { x = (1103515245 * x + 12345) % 2147483648; yield x % 256; } }

// معالجة الصورة وتقسيمها document.getElementById('imageInput').addEventListener('change', async (e)=>{ const file = e.target.files[0]; if(!file) return; const img = new Image(); img.src = URL.createObjectURL(file); img.onload = ()=>{ const w = CHUNK_SIZE * Math.ceil(img.width / CHUNK_SIZE); const h = CHUNK_SIZE * Math.ceil(img.height / CHUNK_SIZE); previewCanvas.width = reconstructCanvas.width = w; previewCanvas.height = reconstructCanvas.height = h; previewCtx.drawImage(img, 0, 0, w, h);

const imgData = previewCtx.getImageData(0,0,w,h);
chunks = [];

for(let y=0; y<h; y+=CHUNK_SIZE){
  for(let x=0; x<w; x+=CHUNK_SIZE){
    const chunkArray = [];
    for(let yy=0; yy<CHUNK_SIZE; yy++){
      for(let xx=0; xx<CHUNK_SIZE; xx++){
        const px = x+xx, py = y+yy;
        if(px<w && py<h){
          const idx = (py*w+px)*4;
          chunkArray.push(imgData.data[idx]); // نستعمل R فقط للبساطة
        } else chunkArray.push(0);
      }
    }
    const t = Date.now() + Math.floor(Math.random()*1000); // seed لكل chunk
    chunks.push({t:t,data:chunkArray.length}); // نخزن t وطول البيانات
  }
}
alert('تم تقسيم الصورة إلى '+chunks.length+' chunks');

}; });

// إرسال المفاتيح t فقط document.getElementById('sendBtn').addEventListener('click', ()=>{ if(chunks.length===0) return; const payload = chunks.map(c=>({t:c.t,l:c.data})); set(streamRef, {chunks:payload}); alert('تم إرسال مفاتيح t لكل chunk'); });

// المستقبل: إعادة توليد كل chunk onValue(streamRef, (snap)=>{ const data = snap.val(); if(!data || !data.chunks) return; const w = previewCanvas.width, h = previewCanvas.height; const imgData = reconstructCtx.createImageData(w,h); let cx=0,cy=0;

data.chunks.forEach(chunk=>{ const gen = proceduralChunk(chunk.t, chunk.l); for(let yy=0;yy<CHUNK_SIZE;yy++){ for(let xx=0;xx<CHUNK_SIZE;xx++){ const px=cx+xx, py=cy+yy; if(px<w && py<h){ const idx=(py*w+px)*4; const val = gen.next().value; imgData.data[idx] = val; // R imgData.data[idx+1] = val; // G imgData.data[idx+2] = val; // B imgData.data[idx+3] = 255; // alpha } } } cx += CHUNK_SIZE; if(cx>=w){ cx=0; cy+=CHUNK_SIZE; } }); reconstructCtx.putImageData(imgData,0,0); }); </script>

</body>
</html>
