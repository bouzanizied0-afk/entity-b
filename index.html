<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUP Unified Console | مركز التحكم الموحد</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-green: #00ff41;
            --neon-red: #ff3131;
            --dark-bg: #0a0a0c;
            --panel-bg: rgba(20, 20, 25, 0.95);
        }

        body {
            background: var(--dark-bg);
            color: #fff;
            font-family: 'Segoe UI', Courier, monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* لوحة القيادة العلوية */
        .dashboard {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15);
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        .system-info { text-align: right; }
        .system-info h2 { margin: 0; font-size: 1rem; color: var(--neon-blue); letter-spacing: 1px; }

        /* العداد المرمز والنسبة المئوية */
        .telemetry {
            text-align: center;
            flex-grow: 1;
        }
        #progressStatus {
            font-size: 1.5rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            font-weight: bold;
        }
        #rotaryCounter {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--neon-blue);
            opacity: 0.8;
        }

        /* لمبة الاتصال */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--neon-red); /* الافتراضي أحمر */
            box-shadow: 0 0 10px var(--neon-red);
            transition: 0.5s;
        }
        .dot.online {
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* منطقة العرض والدردشة */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .canvas-section {
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        canvas { image-rendering: pixelated; max-width: 100%; height: auto; }

        /* نافذة الدردشة */
        .chat-section {
            background: var(--panel-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .chat-header {
            padding: 10px;
            border-bottom: 1px solid #333;
            font-size: 0.8rem;
            color: var(--neon-blue);
            text-align: center;
        }
        #messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--neon-green);
        }
        .chat-input-area {
            padding: 10px;
            border-top: 1px solid #333;
            display: flex;
            gap: 5px;
        }
        #msgInput {
            flex-grow: 1;
            background: #000;
            border: 1px solid var(--neon-blue);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        /* أزرار التحكم */
        .bottom-controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
        }
        .btn:hover:not(:disabled) { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .btn-send { border-color: var(--neon-green); color: var(--neon-green); }
        .btn-send:hover:not(:disabled) { background: var(--neon-green); color: #000; box-shadow: 0 0 15px var(--neon-green); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #fileInput { display: none; }
        .upload-lbl { cursor: pointer; border: 1px dashed #fff; padding: 12px 25px; border-radius: 4px; }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: rgba(0, 242, 255, 0.2);
            top: 0;
            left: 0;
            animation: scan 3s linear infinite;
            pointer-events: none;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="system-info">
            <h2>QUP UNIFIED PROTOCOL</h2>
            <div id="rotaryCounter">CLOCK: 0000000000</div>
        </div>

        <div class="telemetry">
            <div id="progressStatus">0%</div>
            <div style="font-size: 0.6rem;">STREAMING SYNC</div>
        </div>

        <div class="connection-status">
            <span id="statusText" style="font-size: 0.7rem;">OFFLINE</span>
            <div id="connDot" class="dot"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="canvas-section">
            <div class="scan-line"></div>
            <canvas id="matrixCanvas"></canvas>
        </div>

        <div class="chat-section">
            <div class="chat-header">SECURE DEEP-STREAM CHAT</div>
            <div id="messages"></div>
            <div class="chat-input-area">
                <input type="text" id="msgInput" placeholder="اكتب رسالة نبضية...">
                <button id="sendMsgBtn" class="btn" style="padding: 5px 10px;">بث</button>
            </div>
        </div>
    </div>

    <div class="bottom-controls">
        <label for="fileInput" class="upload-lbl">📁 اختيار مصفوفة/ملف</label>
        <input type="file" id="fileInput">
        
        <button id="sendBtn" class="btn btn-send" disabled>إطلاق النبضة الكاملة</button>
        <button id="clearBtn" class="btn" onclick="location.reload()">تصفير شامل</button>
    </div>

    <script type="module">
        import { io } from "https://cdn.socket.io/4.7.4/socket.io.esm.min.js";
        
        // تحديث لمبة الاتصال
        const socket = io("http://127.0.0.1:3000");
        socket.on('connect', () => {
            document.getElementById('connDot').classList.add('online');
            document.getElementById('statusText').innerText = 'ONLINE';
        });
        socket.on('disconnect', () => {
            document.getElementById('connDot').classList.remove('online');
            document.getElementById('statusText').innerText = 'OFFLINE';
        });

        // تعريف الدوال المساعدة التي طلبها Zied.js للواجهة
        window.updateProgressPulse = (ratio) => {
            const percent = Math.floor(ratio * 100);
            document.getElementById('progressStatus').innerText = percent + "%";
        };

        window.updateRotaryVisual = (tick, total) => {
            document.getElementById('rotaryCounter').innerText = `CLOCK: ${tick.toString().padStart(10, '0')}`;
        };

        // تفعيل إرسال الرسائل عبر الدردشة
        document.getElementById('sendMsgBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            if(input.value && window.injectTextMessage) {
                window.injectTextMessage(input.value);
                const msgDiv = document.createElement('div');
                msgDiv.innerText = ">> " + input.value;
                document.getElementById('messages').appendChild(msgDiv);
                input.value = "";
            }
        };
    </script>

    <script type="module" src="Zied.js"></script>

</body>
</html>
