<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>⏳ Temporal Numeric Stream - النسخة المتقدمة</title>
<style>
body {
  background:#000;
  color:#0f0;
  font-family: monospace;
  text-align:center;
  padding-top:20px;
}
#counter, #sendCounter { font-size:48px; margin:10px; }
#chat {
  font-size:22px;
  color:#ff0;
  margin:20px auto;
  width:80%;
  max-height:400px;
  overflow-y:auto;
  text-align:left;
  border:1px solid #0f0;
  padding:10px;
  white-space:pre-wrap;
}
input[type=text] { width:50%; font-size:18px; padding:8px; }
button {
  font-size:16px;
  padding:8px 16px;
  margin:5px;
  background:#003300;
  color:#0f0;
  border:1px solid #0f0;
}
img, video {
  max-width:100%;
  display:block;
  margin-top:10px;
  border:1px solid #0f0;
}
</style>
</head>
<body>

<h2>⏳ بث رقمي مزدوج - النسخة المتقدمة</h2>
<div>العداد للتزامن: <span id="counter">0</span></div>
<div>العداد للإرسال الفوري: <span id="sendCounter">0</span></div>

<div id="chat"></div>

<input id="input" placeholder="اكتب أي شيء">
<button id="sendBtn">إرسال نص</button>
<button id="fileBtn">إرسال ملف</button>
<button id="clearBtn">🗑 حذف الكل</button>
<button id="leaderBtn">▶ تشغيل العداد</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ================= Firebase =================
const firebaseConfig = {
  apiKey: "AIzaSyD4XkZaqv7_c-uiUFc2NvZEFyQUapirz-Y",
  authDomain: "setouchi-it.firebaseapp.com",
  databaseURL: "https://setouchi-it-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "setouchi-it",
  storageBucket: "setouchi-it.appspot.com",
  messagingSenderId: "456612217542",
  appId: "1:456612217542:web:51d963523b1306e0bf4dc7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= Firebase Paths =================
const counterRef = ref(db, "temporal/counter");       // العداد القديم للتزامن
const sendTickRef = ref(db, "temporal/sendTick");    // العداد الثاني السريع للإرسال
const leaderRef  = ref(db, "temporal/leader");
const streamRef  = ref(db, "temporal/stream");

// ================= DOM =================
const counterDiv = document.getElementById("counter");
const sendCounterDiv = document.getElementById("sendCounter");
const chatDiv = document.getElementById("chat");
const input = document.getElementById("input");
const leaderBtn = document.getElementById("leaderBtn");

let localInterval = null;
let isLeader = false;

// ================= Client ID =================
if(!sessionStorage.getItem("clientId")){
  sessionStorage.setItem("clientId", "c_" + Date.now() + "_" + Math.random());
}
const clientId = sessionStorage.getItem("clientId");

// ================= Leader Control =================
onValue(leaderRef, snap=>{
  isLeader = snap.val() === clientId;
  leaderBtn.textContent = isLeader ? "⏸ إيقاف العداد" : "▶ تشغيل العداد";
});

leaderBtn.onclick = async ()=>{
  if(isLeader){
    clearInterval(localInterval);
    localInterval = null;
    await set(leaderRef, null);
  } else {
    await set(leaderRef, clientId);
    startCounter();
  }
};

// ================= Counter (التزامن) =================
onValue(counterRef, snap=>{
  if(snap.val() !== null){
    counterDiv.textContent = snap.val();
  }
});

function startCounter(){
  if(localInterval) return;
  localInterval = setInterval(async ()=>{
    const v = parseInt(counterDiv.textContent || "0", 10) + 1;
    await set(counterRef, v);
  }, 600);
}

// ================= Numeric Stream Reader =================
onValue(streamRef, snap=>{
  const data = snap.val() || {};
  const ticks = Object.keys(data).sort((a,b)=>{
    return parseInt(a.split("_")[1]) - parseInt(b.split("_")[1]);
  });

  let textOut = "";
  const bytes = [];

  ticks.forEach(t=>{
    const v = data[t];
    if(v <= 255){
      bytes.push(v);
    } else {
      textOut += String.fromCharCode(v);
    }
  });

  chatDiv.innerHTML = "";
  if(textOut) chatDiv.textContent = textOut;

  if(bytes.length > 0){
    const blob = new Blob([new Uint8Array(bytes)]);
    const url = URL.createObjectURL(blob);

    // نوع الملف تلقائي
    if(url.endsWith(".mp4") || bytes[0]===0x00){
      const video = document.createElement("video");
      video.src = url;
      video.controls = true;
      chatDiv.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = url;
      chatDiv.appendChild(img);
    }
  }
  chatDiv.scrollTop = chatDiv.scrollHeight;
});

// ================= Send Text =================
document.getElementById("sendBtn").onclick = async ()=>{
  const value = input.value;
  if(!value) return;

  let sendTick = parseInt(sendCounterDiv.textContent || "0", 10);

  for(const ch of value){
    sendTick++;
    const code = ch.charCodeAt(0);
    await set(ref(db, `temporal/sendTick/tick_${sendTick}`), code);
    sendCounterDiv.textContent = sendTick;
  }

  input.value = "";
};

// ================= Send File (Fast Byte Stream) =================
document.getElementById("fileBtn").onclick = ()=>{
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.onchange = async e=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = async evt=>{
      const arr = new Uint8Array(evt.target.result);
      let sendTick = parseInt(sendCounterDiv.textContent || "0", 10);

      // إرسال بايتات بأقصى سرعة ممكنة
      for(const byte of arr){
        sendTick++;
        await set(ref(db, `temporal/sendTick/tick_${sendTick}`), byte);
        sendCounterDiv.textContent = sendTick;
      }
    };
    reader.readAsArrayBuffer(file);
  };
  fileInput.click();
};

// ================= Fast Reader =================
onValue(sendTickRef, snap=>{
  const data = snap.val() || {};
  const ticks = Object.keys(data).sort((a,b)=>{
    return parseInt(a.split("_")[1]) - parseInt(b.split("_")[1]);
  });

  let textOut = "";
  const bytes = [];

  ticks.forEach(t=>{
    const v = data[t];
    if(v <= 255){
      bytes.push(v);
    } else {
      textOut += String.fromCharCode(v);
    }
  });

  if(textOut) chatDiv.textContent = textOut;

  if(bytes.length > 0){
    const blob = new Blob([new Uint8Array(bytes)]);
    const url = URL.createObjectURL(blob);

    const lastByte = bytes[0];
    if(lastByte===0x00 || arrIncludesMP4(bytes)){
      const video = document.createElement("video");
      video.src = url;
      video.controls = true;
      chatDiv.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = url;
      chatDiv.appendChild(img);
    }
  }

  chatDiv.scrollTop = chatDiv.scrollHeight;
  sendCounterDiv.textContent = ticks.length > 0 ? ticks[ticks.length-1].split("_")[1] : "0";
});

// ================= Clear =================
document.getElementById("clearBtn").onclick = async ()=>{
  await set(streamRef, null);
  await set(counterRef, 0);
  await set(sendTickRef, null);
  counterDiv.textContent = "0";
  sendCounterDiv.textContent = "0";
};

// ================= Utility =================
function arrIncludesMP4(arr){
  // تحقق من صيغة MP4 عبر رأس الملف
  return arr[0]===0x00 && arr[1]===0x00 && arr[2]===0x00 && arr[3]===0x18;
}
</script>
</body>
</html>
