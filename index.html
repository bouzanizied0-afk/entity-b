<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دردشة متزامنة مع الخادم</title>
<style>
html,body{margin:0;height:100%;font-family:sans-serif;background:#0a0a0a;color:#eee}
#chat{display:flex;flex-direction:column;height:100%}
#msgs{flex:1;overflow:auto;padding:10px}
.msg{margin:6px 0;padding:8px 12px;border-radius:10px;max-width:70%}
.me{background:#00d4ff;color:#000;margin-left:auto}
.other{background:#222}
#bar{display:flex;padding:10px;gap:5px;border-top:1px solid #222}
input[type=text]{flex:1;padding:8px;border-radius:8px;border:none}
button{padding:8px 12px;border:none;border-radius:8px;background:#00d4ff;cursor:pointer}
input[type=file]{display:none}
img{max-width:200px;border-radius:8px}
a{color:#00d4ff}
</style>
</head>
<body>

<div id="chat">
  <div id="msgs"></div>
  <div id="bar">
    <input id="text" placeholder="اكتب رسالة..." />
    <button onclick="sendText()">إرسال</button>
    <button onclick="file.click()">📎</button>
    <input id="file" type="file" />
  </div>
</div>

<script type="module">
import { ref, push, onChildAdded, set, get } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

import { db, PATHS, startHeartbeat } from "./serverCore.js";
import { StateEngine } from "./engine.js"; // محرك الملفات

startHeartbeat(); // يبدأ عداد الخادم

const msgsRef = ref(db, PATHS.stream);
const msgsDiv = document.getElementById("msgs");
const text = document.getElementById("text");
const file = document.getElementById("file");
const me = crypto.randomUUID();

// إنشاء محرك الحالة مع ربطه بالخادم
const engine = new StateEngine({
    onNewState: async (data) => {
        // جلب الرقم التالي للعداد
        const counterSnap = await get(ref(db, PATHS.counter));
        const nextT = (counterSnap.val() || 0) + 1;

        // حفظ الحالة على الخادم
        await set(ref(db, `${PATHS.stream}/state_${nextT}`), { data, type: data.split(";")[0].replace("data:", "") });
        await set(ref(db, PATHS.counter), nextT);

        // دفع الرسالة للدردشة
        push(msgsRef, { type: "img", data, uid: me });
    },
    onStatusChange: (status) => {
        console.log(status);
    }
});

// عرض الرسائل الجديدة
function addMsg(html, mine){
  const d=document.createElement("div");
  d.className="msg "+(mine?"me":"other");
  d.innerHTML=html;
  msgsDiv.appendChild(d);
  msgsDiv.scrollTop=msgsDiv.scrollHeight;
}

onChildAdded(msgsRef, s=>{
  const m=s.val();
  if(!m)return;
  if(m.type==="text") addMsg(m.data,m.uid===me);
  if(m.type==="img") addMsg(`<img src="${m.data}">`,m.uid===me);
  if(m.type==="file") addMsg(`<a href="${m.data}" download>${m.name}</a>`,m.uid===me);
});

// إرسال نصوص
window.sendText=()=>{
  if(!text.value)return;
  push(msgsRef,{type:"text",data:text.value,uid:me});
  text.value="";
};

// إرسال الملفات مع الربط المباشر بمحرك الحالة
file.onchange = () => {
    const f = file.files[0];
    if(!f) return;
    engine.sendFile(f);
};
</script>

</body>
</html>
